<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulador MML · Jóvenes en Ciencia para la Paz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#1a5c38;--g2:#2d7a4f;--g3:#e8f5ee;--g4:#f4faf7;
  --b1:#1e3a5f;--b2:#2563eb;--b3:#dbeafe;
  --a1:#92400e;--a2:#fef3c7;
  --ink:#1a1a18;--ink2:#4a4a45;--ink3:#8a8a82;
  --bdr:#e2e8e0;--bdr2:#f0f4f0;
  --bg:#f8faf8;--white:#fff;
  --r:8px;--r2:12px;--r3:16px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.04);
  --font:'Inter',system-ui,sans-serif;
  --font-d:'Fraunces',Georgia,serif;
}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);min-height:100vh}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh;overflow:hidden}
.topbar{background:var(--g1);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.topbar-brand{font-family:var(--font-d);font-size:16px;color:#fff;font-weight:700}
.topbar-brand em{color:#a8d5b8;font-style:italic;font-weight:400}
.topbar-right{display:flex;align-items:center;gap:10px}
.save-pill{font-size:11px;color:#a8d5b8;display:flex;align-items:center;gap:5px}
.save-dot{width:6px;height:6px;border-radius:50%;background:#a8d5b8;transition:all .3s}
.save-dot.saving{background:#fbbf24;animation:pulse 1s infinite}
.save-dot.saved{background:#6ee7b7}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.body{display:grid;grid-template-columns:200px 1fr 320px;height:calc(100vh - 56px);overflow:hidden}
.sidebar{background:var(--white);border-right:1px solid var(--bdr2);overflow-y:auto;padding:12px 0}
.sidebar-section{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:8px 14px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;font-size:12px;color:var(--ink2)}
.nav-item:hover{background:var(--g4);color:var(--ink)}
.nav-item.active{background:var(--g3);border-left-color:var(--g1);color:var(--g1);font-weight:500}
.nav-item.done .nav-num{background:var(--g1);color:#fff}
.nav-num{width:20px;height:20px;border-radius:50%;background:var(--bdr2);color:var(--ink3);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item.active .nav-num{background:var(--g1);color:#fff}
.prog-bar{margin:8px 14px 4px;height:3px;background:var(--bdr2);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--g1);border-radius:3px;transition:width .4s}
.sidebar-btn{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:var(--ink2);transition:all .15s;border:none;background:none;width:100%;text-align:left}
.sidebar-btn:hover{background:var(--g4);color:var(--g1)}
.sidebar-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sidebar-divider{height:1px;background:var(--bdr2);margin:8px 0}
.main{overflow-y:auto;padding:20px}
.main-inner{max-width:680px;margin:0 auto}
.session-header{margin-bottom:18px}
.session-header h2{font-family:var(--font-d);font-size:20px;color:var(--g1);margin-bottom:3px}
.session-header p{font-size:12px;color:var(--ink3);line-height:1.5}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-s{background:var(--g3);color:var(--g1);margin-bottom:6px}
.badge-sec{background:var(--b3);color:var(--b1);margin-bottom:6px;margin-left:4px}
.card{background:var(--white);border:1px solid var(--bdr2);border-radius:var(--r3);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.field{margin-bottom:14px;position:relative}
.field-row{display:grid;gap:10px;margin-bottom:14px}
.field-row.cols2{grid-template-columns:1fr 1fr}
.field-row.cols3{grid-template-columns:1fr 1fr 1fr}
.lbl{font-size:12px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:5px;margin-bottom:5px;line-height:1.4}
.lbl .sub{font-size:11px;color:var(--ink3);font-weight:400}
input[type=text],input[type=number],input[type=email],textarea,select{
  width:100%;font-family:var(--font);font-size:13px;color:var(--ink);
  background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);
  padding:8px 11px;transition:border-color .15s,background .15s;resize:vertical
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--g2);background:var(--white)}
textarea{min-height:72px;line-height:1.6}
.tip-btn{width:18px;height:18px;border-radius:50%;background:var(--b2);color:#fff;font-size:10px;font-weight:700;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.tip-btn:hover{background:var(--b1)}
.tooltip-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
.tooltip-box{background:var(--white);border-radius:var(--r3);padding:24px;max-width:520px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.2);max-height:80vh;overflow-y:auto}
.tooltip-box h4{font-family:var(--font-d);font-size:17px;color:var(--g1);margin-bottom:6px}
.tooltip-box .source{font-size:10px;color:var(--ink3);margin-bottom:14px;font-style:italic}
.tip-section{margin-bottom:12px}
.tip-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.tip-section-label.def{color:var(--b1)}
.tip-section-label.ok{color:var(--g1)}
.tip-section-label.bad{color:#dc2626}
.tip-section-label.check{color:var(--a1)}
.tip-section p{font-size:13px;color:var(--ink2);line-height:1.7;background:var(--bg);border-radius:6px;padding:8px 10px}
.tip-section p.ok{background:var(--g3);border-left:3px solid var(--g1)}
.tip-section p.bad{background:#fef2f2;border-left:3px solid #dc2626}
.tip-close{margin-top:14px;width:100%;padding:9px;background:var(--g1);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font)}
.note{padding:9px 12px;border-radius:0 var(--r) var(--r) 0;font-size:12px;line-height:1.6;margin-bottom:12px}
.note.info{background:var(--g4);border-left:3px solid var(--g2);color:var(--ink2)}
.note.warn{background:var(--a2);border-left:3px solid #d97706;color:var(--a1)}
.note.ok{background:var(--g3);border-left:3px solid var(--g1);color:var(--g1);font-weight:500}
.note.err{background:#fef2f2;border-left:3px solid #dc2626;color:#dc2626}
.tree-wrap{overflow-x:auto}
.tree-level{margin-bottom:4px}
.tree-level-label{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:20px;margin-bottom:6px}
.tree-grid{display:grid;gap:6px}
.tree-box{border:1px solid;border-radius:var(--r);padding:8px 10px;min-height:60px;position:relative}
.tree-box textarea{background:transparent;border:none;font-size:12px;width:100%;resize:none;min-height:44px;padding:0;line-height:1.5}
.tree-box textarea:focus{outline:none}
.tree-box .box-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.connector-v{display:flex;justify-content:center;height:16px}
.connector-v::after{content:'';width:2px;height:100%;background:var(--bdr);display:block}
.connector-h{position:relative;height:16px;margin-bottom:4px}
.connector-h::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:var(--bdr)}
.connector-h::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--bdr)}
.lvl-fi2{background:#eff6ff;border-color:#93c5fd}.lvl-fi2 .box-label{color:#1d4ed8}
.lvl-fi1{background:#dbeafe;border-color:#60a5fa}.lvl-fi1 .box-label{color:#1e3a5f}
.lvl-central{background:var(--g1);border-color:var(--g1)}.lvl-central .box-label{color:rgba(255,255,255,.7)}.lvl-central textarea{color:#fff;font-weight:500}
.lvl-ca1{background:#fffbeb;border-color:#fcd34d}.lvl-ca1 .box-label{color:#92400e}
.lvl-ca2{background:#fef3c7;border-color:#fbbf24}.lvl-ca2 .box-label{color:#78350f}
.lvl-obj{background:var(--g3);border-color:#86efac}.lvl-obj .box-label{color:var(--g1)}
.lvl-med1{background:#dcfce7;border-color:#4ade80}.lvl-med1 .box-label{color:#15803d}
.lvl-med2{background:#f0fdf4;border-color:#86efac}.lvl-med2 .box-label{color:#166534}
.mml-wrap{overflow-x:auto}
.mml-table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
.mml-table th{background:var(--g1);color:#fff;padding:9px 10px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:left;border:1px solid rgba(255,255,255,.2)}
.mml-table td{padding:8px 10px;border:1px solid var(--bdr);vertical-align:top;font-size:12px;line-height:1.6}
.mml-lbl{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:3px}
.mml-table .row-fin td{background:#eff6ff}
.mml-table .row-prop td{background:#f0fdf4}
.mml-table .row-res td{background:var(--white)}
.mml-table .row-act td{background:var(--bg)}
.mml-table .row-pre td{background:var(--a2)}
.chip-group{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{padding:4px 11px;border-radius:20px;border:1px solid var(--bdr);font-size:12px;cursor:pointer;background:var(--white);color:var(--ink2);transition:all .12s;font-family:var(--font)}
.chip:hover{border-color:var(--g2);color:var(--g1)}
.chip.sel{background:var(--g3);color:var(--g1);border-color:var(--g2);font-weight:500}
.muni-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:3px;margin-top:5px}
.muni-chip{padding:4px 7px;border-radius:6px;border:1px solid var(--bdr);font-size:11px;cursor:pointer;background:var(--white);color:var(--ink2);text-align:center;transition:all .1s}
.muni-chip.sel{background:var(--g3);color:var(--g1);border-color:var(--g2)}
.panel{background:var(--white);border-left:1px solid var(--bdr2);overflow-y:auto;padding:14px}
.panel-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.matrix-preview{font-size:11px}
.mp-row{border:1px solid var(--bdr);border-radius:6px;margin-bottom:6px;overflow:hidden}
.mp-header{padding:5px 9px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#fff}
.mp-body{padding:7px 9px;font-size:11px;line-height:1.6;color:var(--ink2)}
.mp-sub{font-size:10px;color:var(--ink3);margin-top:3px}
.mp-empty{color:var(--ink3);font-style:italic}
.mp-fin .mp-header{background:#1d4ed8}
.mp-prop .mp-header{background:var(--g1)}
.mp-res .mp-header{background:#15803d}
.mp-act .mp-header{background:var(--ink2)}
.mp-pre .mp-header{background:#92400e}
.btn{padding:8px 16px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--white);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--g1);color:#fff;border-color:var(--g1)}
.btn.primary:hover{background:var(--g2)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-footer{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid var(--bdr2);margin-top:4px}
.res-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.res-num{width:26px;height:26px;border-radius:50%;background:var(--g3);color:var(--g1);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px}
.act-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.act-code{min-width:36px;font-size:11px;font-weight:600;color:var(--ink3);margin-top:10px;text-align:right}
.val-ok{color:var(--g1);font-size:11px;margin-top:3px}
.val-err{color:#dc2626;font-size:11px;margin-top:3px}
#pdf-content{background:#fff;padding:28px;font-size:12px;line-height:1.7}
#pdf-content h2{font-family:var(--font-d);font-size:16px;color:var(--g1);margin:18px 0 6px;border-bottom:1px solid var(--bdr2);padding-bottom:3px}
#pdf-content h3{font-size:13px;font-weight:600;color:var(--ink);margin:12px 0 4px}
.pdf-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.pdf-table th{background:var(--g1);color:#fff;padding:5px 8px;text-align:left;border:1px solid rgba(255,255,255,.2)}
.pdf-table td{padding:5px 8px;border:1px solid var(--bdr);vertical-align:top}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13px;z-index:999;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.green{background:var(--g1)}
@media(max-width:900px){.body{grid-template-columns:0 1fr 0}.sidebar,.panel{display:none}}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--white);z-index:301;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:12px 0;box-shadow:4px 0 20px rgba(0,0,0,.15)}
.drawer.open{transform:translateX(0)}
.drawer-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:none;background:var(--bdr2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink2)}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-overlay.open{opacity:1;pointer-events:all}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80vh;background:var(--white);z-index:301;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:16px}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 14px}
.fab-row{position:fixed;bottom:20px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.fab{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:20px;transition:transform .15s}
.fab:hover{transform:scale(1.05)}
.fab-main{background:var(--g1);color:#fff}
.fab-secondary{background:var(--white);color:var(--g1);border:2px solid var(--g1)}
@media(min-width:901px){.fab-row{display:none}}
.hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;padding:8px;border-radius:6px}
.hamburger span{width:20px;height:2px;background:rgba(255,255,255,.9);border-radius:2px;display:block;transition:all .2s}
@media(max-width:900px){.hamburger{display:flex}}
.onboard{position:fixed;inset:0;background:var(--g1);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px}
.onboard-card{background:var(--white);border-radius:20px;padding:36px 32px;max-width:440px;width:100%;text-align:center}
.onboard-icon{font-size:48px;margin-bottom:16px}
.onboard h1{font-family:var(--font-d);font-size:22px;color:var(--g1);margin-bottom:8px}
.onboard p{font-size:14px;color:var(--ink2);line-height:1.7;margin-bottom:6px}
.onboard-steps{text-align:left;margin:16px 0 24px;display:flex;flex-direction:column;gap:10px}
.onboard-step{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink2)}
.onboard-step-num{width:24px;height:24px;border-radius:50%;background:var(--g3);color:var(--g1);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.onboard-name{width:100%;font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);border:1.5px solid var(--bdr);border-radius:var(--r);padding:10px 13px;margin-bottom:10px;transition:border-color .15s}
.onboard-name:focus{outline:none;border-color:var(--g2);background:var(--white)}
.onboard-btn{width:100%;padding:12px;background:var(--g1);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .15s}
.onboard-btn:hover{background:var(--g2)}
.completeness-bar{background:var(--bdr2);border-radius:var(--r);padding:12px 14px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.completeness-label{font-size:12px;color:var(--ink2)}
.completeness-count{font-size:12px;font-weight:600}
.completeness-count.full{color:var(--g1)}
.completeness-count.partial{color:#d97706}
.completeness-mini{height:4px;flex:1;background:var(--bdr);border-radius:4px;overflow:hidden}
.completeness-mini-fill{height:100%;border-radius:4px;transition:width .3s}
.tip-btn{width:28px;height:28px;border-radius:50%;background:var(--b2);color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;vertical-align:middle;touch-action:manipulation}
.tip-btn:hover{background:var(--b1)}
@media(max-width:900px){.tip-btn{width:36px;height:36px;font-size:13px}}
.req{color:#dc2626;margin-left:2px}
.box-label{font-size:11px!important}
.tree-level-label{font-size:11px!important}
.act-code{font-size:12px!important}
.nav-num{font-size:11px!important}
.mml-lbl{font-size:10px!important}
.prog-bar{margin-top:4px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:999;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none;max-width:320px;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translateY(0);pointer-events:all}
.toast.green{background:var(--g1)}
.toast.err{background:#dc2626;pointer-events:all}
.toast-close{background:none;border:none;color:rgba(255,255,255,.8);cursor:pointer;font-size:16px;padding:0;line-height:1;flex-shrink:0}
@media(max-width:900px){
  .body{grid-template-columns:1fr}
  .topbar{padding:0 14px}
  .topbar-brand{font-size:14px}
  .topbar-right .btn{display:none}
  .main{padding:14px}
  .card{padding:14px}
  .field-row.cols2,.field-row.cols3{grid-template-columns:1fr}
  .tree-grid{grid-template-columns:1fr!important}
  .tree-box textarea{min-height:54px}
}
.rubro-hint{font-size:11px;color:rgba(255,255,255,.7);margin-left:8px}
</style>

function openDrawer() {
  document.getElementById('nav-drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('nav-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}
function openSheet() {
  document.getElementById('matrix-sheet').classList.add('open');
  document.getElementById('sheet-overlay').classList.add('open');
}
function closeSheet() {
  document.getElementById('matrix-sheet').classList.remove('open');
  document.getElementById('sheet-overlay').classList.remove('open');
}

function showOnboarding() {
  const ob = document.getElementById('onboard-screen');
  if(ob) ob.style.display='flex';
}
function finishOnboard() {
  const name = (document.getElementById('onboard-name')||{}).value||'';
  if(name.trim().length < 2) {
    document.getElementById('onboard-name').style.borderColor='#dc2626';
    return;
  }
  S._onboarded = true;
  S._userName = name.trim();
  if(!S.f1) S.f1 = name.trim();
  scheduleSave();
  const ob = document.getElementById('onboard-screen');
  if(ob) { ob.style.opacity='0'; ob.style.transition='opacity .3s'; setTimeout(()=>ob.remove(),300); }
}

function initDB() {
  if (!window.indexedDB) return;
  const req = indexedDB.open('mmlsena', 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore('data', {keyPath:'k'});
  req.onsuccess = e => { db = e.target.result; dbReady = true; loadDB(); };
  req.onerror = () => {};
}

function saveDB(payload) {
  if (!dbReady || !db) return;
  try {
    const tx = db.transaction('data','readwrite');
    tx.objectStore('data').put({k:STORAGE_KEY, v:payload, t:Date.now()});
  } catch(e) {}
}

function loadDB() {
  if (!dbReady || !db) return;
  try {
    const tx = db.transaction('data','readonly');
    const req = tx.objectStore('data').get(STORAGE_KEY);
    req.onsuccess = e => {
      if (e.target.result) {
        const idb = JSON.parse(e.target.result.v);
        const ls = loadLS();
        const idbEsMasReciente = !ls || (idb.t && ls.t && idb.t > ls.t);
        const reemplazaríaContenidoBuenoConVacío = hasContent(S) && !hasContent(idb.data);
        if (idbEsMasReciente && !reemplazaríaContenidoBuenoConVacío) {
          Object.assign(S, idb.data);
          migrateToMultiObjective();
          render();
        } else if (reemplazaríaContenidoBuenoConVacío) {
          console.warn('Formulador MML: carga desde IndexedDB bloqueada — habría reemplazado datos con contenido por un estado vacío.');
        }
      }
    };
  } catch(e) {}
}

function saveLS(payload) {
  try { localStorage.setItem(STORAGE_KEY, payload); } catch(e) {}
  try { sessionStorage.setItem(STORAGE_KEY, payload); } catch(e) {}
}

function loadLS() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function hasContent(data) {
  if (!data) return false;
  const camposTexto = ['titulo','problema','obj_central','obj_general','obj_especifico','resumen'];
  if (camposTexto.some(k => data[k] && String(data[k]).trim())) return true;
  const camposArray = ['efdir','efind','cadir','caind','fdir','find_','mdir','mind','resultados'];
  if (camposArray.some(k => Array.isArray(data[k]) && data[k].some(v => v && String(v).trim()))) return true;
  if (Array.isArray(data.objetivos_esp) && data.objetivos_esp.some(o =>
    (o.texto && o.texto.trim()) || (Array.isArray(o.resultados) && o.resultados.some(r => r && r.trim()))
  )) return true;
  return false;
}

let saveTimer = null;
function scheduleSave() {
  updateSaveDot('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 1500);
}

function doSave() {
  if (!hasContent(S)) {
    const previo = loadLS();
    if (previo && hasContent(previo.data)) {
      console.warn('Formulador MML: guardado bloqueado — el estado actual está vacío pero ya existían datos guardados. No se sobrescribió nada.');
      updateSaveDot('saved');
      return;
    }
  }
  const payload = JSON.stringify({data:S, t:Date.now()});
  saveLS(payload);
  saveDB(payload);
  if (hasContent(S)) {
    try { localStorage.setItem(STORAGE_KEY + '_backup', payload); } catch(e) {}
  }
  updateSaveDot('saved');
}

function updateSaveDot(state) {
  const dot = document.getElementById('save-dot');
  const txt = document.getElementById('save-txt');
  if (!dot) return;
  dot.className = 'save-dot ' + state;
  if (txt) txt.textContent = state === 'saving' ? 'Guardando…' : 'Guardado';
}

let _restauroDesdeRespaldo = false;
function loadSaved() {
  const saved = loadLS();
  if (saved && saved.data) Object.assign(S, saved.data);

  if (!hasContent(S)) {
    try {
      const backup = localStorage.getItem(STORAGE_KEY + '_backup');
      if (backup) {
        const parsed = JSON.parse(backup);
        if (parsed && hasContent(parsed.data)) {
          Object.assign(S, parsed.data);
          _restauroDesdeRespaldo = true;
        }
      }
    } catch(e) {}
  }

  migrateToMultiObjective();
}

function migrateToMultiObjective() {
  if (S._migrated_v2) return;

  if (!Array.isArray(S.objetivos_esp) || S.objetivos_esp.length === 0) {
    S.objetivos_esp = [{ id:1, texto:'', resultados:['','','',''],
      iov:{ind:'',base:'',meta:'',plazo:''}, iov_resultados:[],
      mv:'', sup:'', res_mv:[], res_sup:[], actividades_struct:[] }];
  }

  const tieneDatosViejos = S.obj_especifico || (S.resultados||[]).some(r=>r);
  const yaTieneEstructuraNueva =
    S.objetivos_esp[0].texto || (S.objetivos_esp[0].resultados||[]).some(r=>r) || S.objetivos_esp.length > 1;

  if (tieneDatosViejos && !yaTieneEstructuraNueva) {
    const o = S.objetivos_esp[0];
    o.texto = S.obj_especifico || '';
    o.resultados = (S.resultados && S.resultados.length) ? [...S.resultados] : ['','','',''];
    o.iov = S.iov_proposito ? {...S.iov_proposito} : {ind:'',base:'',meta:'',plazo:''};
    o.iov_resultados = Array.isArray(S.iov_resultados) ? S.iov_resultados.map(x=>({...x})) : [];
    o.mv = S.prop_mv || '';
    o.sup = S.prop_sup || '';
    o.res_mv = Array.isArray(S.res_mv) ? [...S.res_mv] : [];
    o.res_sup = Array.isArray(S.res_sup) ? [...S.res_sup] : [];
    o.actividades_struct = Array.isArray(S.actividades_struct) ? S.actividades_struct.map(a=>[...(a||[])]) : [];
  }

  S.obj_especifico = '';
  S.resultados = ['','','',''];
  S._migrated_v2 = true;
  scheduleSave();
}

function showToast(msg, type='', persist=false) {

  if (!persist && type !== 'err') {

    t._timer = setTimeout(() => t.className='toast', type==='err'?6000:3000);
  }
}
function goSession(id) { S.session=id; render(); window.scrollTo(0,0); }
function sessionCompleteness() {
  const rl = resLlenos();
  switch(S.session) {
    case 1: {
      const fields = [S.f1, S.titulo, S.linea, S.sublinea, S.duracion, S.municipios.length>0?'ok':''];
      const filled = fields.filter(Boolean).length;
      return {filled, total:fields.length, pct:Math.round(filled/fields.length*100)};
    }
    case 2: {
      const ok = S.problema.length>15 && ADJETIVOS_NEG.some(a=>S.problema.toLowerCase().includes(a));
      return {filled:ok?1:0, total:1, pct:ok?100:0};
    }
    case 3: {
      const fields = [...S.efdir.filter(Boolean), ...S.cadir.filter(Boolean)];
      const total = Math.max(S.efdir.length + S.cadir.length, 6);
      return {filled:fields.length, total, pct:Math.round(fields.length/total*100)};
    }
    case 4: {
      const filled = [S.obj_central, ...S.mdir.filter(Boolean)].filter(Boolean).length;
      const total = Math.max(S.mdir.length+1, 4);
      return {filled, total, pct:Math.round(filled/total*100)};
    }
    case 5: {
      const textos = S.objetivos_esp.map(o=>o.texto).filter(Boolean);
      const filled = [...textos, ...rl].length;
      const total = S.objetivos_esp.length + Math.max(rl.length, 3);
      return {filled, total, pct:Math.round(filled/total*100)};
    }
    case 6: {
      const acts = S.objetivos_esp.flatMap(o=>(o.actividades_struct||[]).flatMap(a=>a||[])).filter(Boolean);
      const filled = [S.obj_general, ...acts].filter(Boolean).length;
      const total = 1 + rl.length * 2;
      return {filled:Math.min(filled,total), total, pct:Math.round(Math.min(filled,total)/total*100)};
    }
    case 7: {
      const propOk = S.objetivos_esp.filter(o=>o.iov.ind && o.iov.base && o.iov.meta && o.iov.plazo).length;
      let resOk = 0, resTotal = 0;
      S.objetivos_esp.forEach(o => (o.resultados||[]).forEach((r,ri) => {
        if (!r) return;
        resTotal++;
        const v = (o.iov_resultados[ri])||{};
        if (v.ind && v.base && v.meta && v.plazo) resOk++;
      }));
      const total = S.objetivos_esp.length + resTotal;
      return {filled:propOk+resOk, total:Math.max(total,1), pct:Math.round((propOk+resOk)/Math.max(total,1)*100)};
    }
    case 8: {
      const propFields = S.objetivos_esp.flatMap(o=>[o.mv,o.sup]);
      const fields = [S.fin_mv,S.fin_sup,...propFields,S.precondiciones];
      const filled = fields.filter(Boolean).length;
      return {filled, total:fields.length, pct:Math.round(filled/fields.length*100)};
    }
    case 9: {
      const hasItems = (S.presupuesto_v2||[]).some(rb=>(rb.items||[]).some(it=>it.desc&&it.unit>0));
      const hasRisk = S.riesgos.some(r=>r.desc&&r.mit);
      return {filled:(hasItems?1:0)+(hasRisk?1:0), total:2, pct:Math.round(((hasItems?1:0)+(hasRisk?1:0))/2*100)};
    }
    case 10: {
      const fields = [S.sos_amb,S.sos_soc,S.sos_cap,S.imp_form,S.imp_soc];
      const filled = fields.filter(Boolean).length;
      return {filled, total:fields.length, pct:Math.round(filled/fields.length*100)};
    }
    default: return {filled:0,total:1,pct:0};
  }
}

function markDone() {
  const {pct} = sessionCompleteness();
  if(pct < 50) {
    showToast(`Esta sesión está al ${pct}% — te recomendamos completar más campos antes de continuar.`, '', false);
    if(!S.completed.includes(S.session)) {
      S.completed.push(S.session);
      scheduleSave(); render();
      return;
    }
  }
  if(!S.completed.includes(S.session)) S.completed.push(S.session);
  if(S.session<10) S.session++;
  scheduleSave(); render(); window.scrollTo(0,0);
  showToast(`Sesión ${S.session-1} completada ✓`, 'green');
}

function buildMatrixPreview() {
  const empty = '<span class="mp-empty">—</span>';
  let html = '';

  html += '<div class="mp-row mp-fin">' +
    '<div class="mp-header">FIN — Objetivo general</div>' +
    '<div class="mp-body">' + (S.obj_general || empty) +
    (S.fin_ind ? '<div class="mp-sub">IOV: '+S.fin_ind+'</div>' : '') +
    '</div></div>';

  const multiplesProp = S.objetivos_esp.length > 1;
  S.objetivos_esp.forEach((o,oi) => {
    html += '<div class="mp-row mp-prop">' +
      '<div class="mp-header">OBJ. ESP.'+(multiplesProp?' '+(oi+1):'')+' (PROPÓSITO'+(multiplesProp?' '+(oi+1):'')+')</div>' +
      '<div class="mp-body">' + (o.texto || empty) +
      (o.iov.ind ? '<div class="mp-sub">IOV: '+o.iov.ind+'</div>' : '') +
      '</div></div>';

    const resultadosLlenos = (o.resultados||[]).filter(r=>r);
    if (!resultadosLlenos.length) return;

    html += '<div style="margin:0 0 6px 14px;border-left:2px solid var(--bdr);padding-left:10px">';
    (o.resultados||[]).forEach((r, ri) => {
      if (!r) return;
      const iov = (o.iov_resultados[ri]) || {};
      const acts = ((o.actividades_struct||[])[ri]||[]).filter(a=>a);
      html += '<div class="mp-row mp-res">' +
        '<div class="mp-header">Resultado '+(ri+1)+'</div>' +
        '<div class="mp-body">' + r +
        (iov.ind ? '<div class="mp-sub">IOV: '+iov.ind+'</div>' : '') +
        (acts.length ? '<div style="margin-top:6px;padding-left:10px;border-left:2px solid var(--bdr2)">' +
          acts.map((a,ai)=>'<div class="mp-sub" style="margin-top:2px">Actividad '+(ai+1)+': '+a+'</div>').join('') +
          '</div>' : '') +
        '</div></div>';
    });
    html += '</div>';
  });

  if(S.precondiciones) {
    html += '<div class="mp-row mp-pre">' +
      '<div class="mp-header">PRECONDICIONES</div>' +
      '<div class="mp-body">' + S.precondiciones + '</div></div>';
  }

  return html || '<p style="color:var(--ink3);font-size:12px;padding:8px">La matriz se llenará automáticamente a medida que completes las sesiones.</p>';
}

function renderS1() {
  const muniGrid = MUNICIPIOS.map(m =>
    `<div class="muni-chip${S.municipios.includes(m)?' sel':''}" onclick="toggleMuni('${m}')">${m}</div>`
  ).join('');
  const lineaChips = LINEAS.map(l =>
    `<div class="chip${S.linea===l.id?' sel':''}" onclick="S.linea=(S.linea===l.id?'':l.id);scheduleSave();render()">${l.label}</div>`
  ).join('');
  return card('Formuladores del proyecto',
    field('Formulador 1', `<input type="text" value="${esc(S.f1)}" oninput="S.f1=this.value;scheduleSave();patchLive()" placeholder="Nombre completo del primer formulador">`)
    + fieldRow2(
      field('Formulador 2 (opcional)', `<input type="text" value="${esc(S.f2)}" oninput="S.f2=this.value;scheduleSave();patchLive()" placeholder="Nombre completo">`),
      field('Formulador 3 (opcional)', `<input type="text" value="${esc(S.f3)}" oninput="S.f3=this.value;scheduleSave();patchLive()" placeholder="Nombre completo">`)
    )
  ) + card('Identificación del proyecto',
    field('Nombre del proyecto', tipBtn('titulo') + `<input type="text" id="inp-titulo" value="${esc(S.titulo)}" oninput="S.titulo=this.value;scheduleSave();patchLive()" placeholder="Ej: Sistema IoT de monitoreo hídrico para jóvenes rurales de Cumbal, Nariño">`, 'Máx. 20 palabras. Expresa la solución, no el problema.')
    + field('Línea temática', `<div class="chip-group">${lineaChips}</div>`)
    + field('Sublínea específica', `<input type="text" value="${esc(S.sublinea)}" oninput="S.sublinea=this.value;scheduleSave();patchLive()" placeholder="Ej: Agricultura de precisión y tecnologías para producción sostenible">`)
    + fieldRow2(
      field('Duración (meses)', `<input type="number" min="1" max="24" value="${esc(S.duracion)}" oninput="S.duracion=this.value;scheduleSave();patchLive()" placeholder="12">`),
      field('Palabras clave', `<input type="text" value="${esc(S.palabras)}" oninput="S.palabras=this.value;scheduleSave();patchLive()" placeholder="IoT, agua, innovación, rural">`)
    )
    + field('Municipios de ejecución (suroccidente nariñense)', `<div class="muni-grid">${muniGrid}</div>`)
  ) + card('Resumen ejecutivo',
    '<div class="note info">Escribe esto al final, cuando ya tengas todo el proyecto formulado. En máximo 500 palabras explica: qué problema resuelves, cómo lo resuelves, qué va a cambiar en el territorio y cuáles son los resultados concretos.</div>'
    + field('Resumen / Frase CTel inicial', `<textarea id="inp-res" oninput="S.resumen=this.value;scheduleSave();patchLive()" placeholder="Describe en pocas palabras qué problema resuelve tu proyecto, cómo lo resuelves y qué va a cambiar en el territorio cuando termine…">${esc(S.resumen)}</textarea>`)
  );
}

function renderS2() {
  const hasAdj = ADJETIVOS_NEG.some(a => S.problema.toLowerCase().includes(a));
  const noAus = !S.problema.toLowerCase().includes('falta de') && !S.problema.toLowerCase().includes('ausencia de');
  const ok = hasAdj && noAus && S.problema.length > 15;
  const valHtml = S.problema.length > 10
    ? (ok
      ? '<div class="val-ok">✓ Redacción correcta: contiene adjetivo negativo y no describe ausencia de solución.</div>'
      : `<div class="val-err">${hasAdj?'':'⚠ Incluya un adjetivo negativo. '}${!noAus?'⚠ Evite "falta de…"':''} <button class="btn sm" onclick="showTip('problema')">Ver guía</button></div>`)
    : '';
  return card('Formulación del problema central',
    `<div class="note info">El problema debe describir una situación negativa que ya existe — no lo que falta o lo que hay que hacer. Use adjetivos que describan la magnitud: <em>${ADJETIVOS_NEG.slice(0,6).join(', ')}…</em></div>`
    + field('Problema central', tipBtn('problema')
      + `<textarea id="inp-prob" oninput="S.problema=this.value;scheduleSave();patchLive()" placeholder="Ej: Limitado acceso de los jóvenes rurales de Cumbal a herramientas tecnológicas para el monitoreo ambiental de fuentes hídricas">${esc(S.problema)}</textarea>`
      + valHtml,
      'Redactar en una oración con 1-2 adjetivos negativos.'
    )
  );
}

function renderS3() {
  function treeGrid(arr, key, lvlClass, labelPrefix, removable) {
    return `<div class="tree-grid" style="grid-template-columns:repeat(${Math.max(arr.length,1)},1fr)">`
      + arr.map((v,i) => `<div class="tree-box ${lvlClass}" style="position:relative">
          <div class="box-label" style="display:flex;justify-content:space-between;align-items:center">
            <span>${labelPrefix} ${i+1}</span>
            ${removable && arr.length>1 ? `<button onclick="removeEffectCause('${key}',${i})" title="Eliminar" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:14px;line-height:1;padding:0 2px">×</button>` : ''}
          </div>
          <textarea oninput="S.${key}[${i}]=this.value;scheduleSave();patchLive()" placeholder="Redactar…">${esc(v)}</textarea>
        </div>`).join('')
      + '</div>';
  }
  const NCD = S.cadir.length;
  const NED = S.efdir.length;
  return card('Árbol de problemas',
    '<div class="note info">Abajo van las causas (¿por qué ocurre el problema?), en el centro el problema, arriba los efectos (¿qué pasa por ese problema?). Ninguna causa debe decir "falta de…"<br>'
    + '<strong>Cada efecto/causa indirecta corresponde a un efecto/causa directa</strong> — por eso el número de cuadros en ambos niveles se mantiene igual.</div>'
    + '<div class="tree-wrap">'
    + `<div class="tree-level-label" style="background:#1e3a5f;color:#fff">Efectos 2.° orden ${tipBtn('efecto_indirecto')}</div>`
    + treeGrid(S.efind,'efind','lvl-fi2','Efecto ind.', false)
    + '<div class="connector-v"></div>'
    + `<div class="tree-level-label" style="background:#2563eb;color:#fff">Efectos directos ${tipBtn('efecto_directo')}</div>`
    + treeGrid(S.efdir,'efdir','lvl-fi1','Efecto dir.', true)
    + '<div style="margin:6px 0 4px"><button class="btn sm" onclick="addEffectCause(\'ef\')">+ Agregar efecto</button></div>'
    + '<div class="connector-v"></div>'
    + '<div class="tree-level-label" style="background:var(--g1);color:#fff">⬛ PROBLEMA CENTRAL</div>'
    + `<div class="tree-box lvl-central"><div class="box-label">Problema central</div><div style="color:#fff;font-size:13px;font-weight:500;padding:4px 0">${S.problema||'<em style="opacity:.5">(Definir en Sesión 2)</em>'}</div></div>`
    + '<div class="connector-v"></div>'
    + `<div class="tree-level-label" style="background:#d97706;color:#fff">Causas directas ${tipBtn('causa_directa')}</div>`
    + treeGrid(S.cadir,'cadir','lvl-ca1','Causa dir.', true)
    + '<div style="margin:6px 0 4px"><button class="btn sm" onclick="addEffectCause(\'ca\')">+ Agregar causa</button></div>'
    + '<div class="connector-v"></div>'
    + `<div class="tree-level-label" style="background:#92400e;color:#fff">Causas 2.° orden ${tipBtn('causa_indirecta')}</div>`
    + `<div class="tree-grid" style="grid-template-columns:repeat(${Math.max(NCD,1)},1fr)">`
    + S.cadir.map((_,i) => {
        while(S.caind.length<=i) S.caind.push('');
        return `<div class="tree-box lvl-ca2"><div class="box-label">Causa ind. ${i+1}</div>`
          + `<textarea oninput="S.caind[${i}]=this.value;scheduleSave();patchLive()" placeholder="Causa estructural…">${esc(S.caind[i])}</textarea></div>`;
      }).join('')
    + '</div>'
    + '</div>'
  );
}

function addEffectCause(kind) {
  if (kind === 'ef') { S.efdir.push(''); S.efind.push(''); }
  else { S.cadir.push(''); S.caind.push(''); }
  scheduleSave(); render();
}
function removeEffectCause(key, idx) {
  S[key].splice(idx, 1);
  const pair = { efdir: 'efind', cadir: 'caind' };
  const partner = pair[key];
  if (partner && S[partner].length > idx) S[partner].splice(idx, 1);
  scheduleSave(); render();
}

function renderS4() {
  const adjMap = {reducido:'mejorado',limitado:'fortalecido',deficiente:'mejorado',elevado:'reducido',escaso:'incrementado',frágil:'fortalecida',inestable:'estabilizado',bajo:'incrementado',excesivo:'reducido',deteriorado:'mejorado',insuficiente:'suficiente',débil:'fortalecido',inadecuado:'adecuado'};
  const auto = S.problema ? S.problema.replace(new RegExp('('+ADJETIVOS_NEG.join('|')+')','gi'), m => adjMap[m.toLowerCase()]||m) : '';
  const NMD = S.mdir.length;
  const autoHtml = (auto && !S.obj_central)
    ? `<div class="note ok">Sugerencia automática: <em>${auto}</em> <button class="btn sm" onclick="S.obj_central=${JSON.stringify(auto)};scheduleSave();render()">Usar</button></div>` : '';
  function boxRemovable(arr, key, idx, lvlClass, label, ph, partnerKey) {
    const canRemove = arr.length > 1;
    return `<div class="tree-box ${lvlClass}">
      <div class="box-label" style="display:flex;justify-content:space-between;align-items:center">
        <span>${label} ${idx+1}</span>
        ${canRemove ? `<button onclick="removeFinMedio('${key}',${idx},'${partnerKey}')" title="Eliminar" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:14px;line-height:1;padding:0 2px">×</button>` : ''}
      </div>
      <textarea oninput="S.${key}[${idx}]=this.value;scheduleSave();patchLive()" placeholder="${ph}">${esc(arr[idx])}</textarea>
    </div>`;
  }
  return card(`Árbol de objetivos ${tipBtn('obj_central')}`,
    autoHtml
    + '<div class="note info">Convierte cada elemento del árbol de problemas en su versión positiva: las causas se vuelven medios para lograr el objetivo, y los efectos se vuelven los fines que se quieren alcanzar.<br>'
    + '<strong>Cada fin/medio indirecto corresponde a uno directo</strong> — por eso ambos niveles mantienen el mismo número de cuadros.</div>'
    + '<div class="tree-wrap">'
    + '<div class="tree-level-label" style="background:#1e3a5f;color:#fff">Fines 2.° orden</div>'
    + `<div class="tree-grid" style="grid-template-columns:repeat(${Math.max(S.find_.length,1)},1fr)">`
    + S.find_.map((v,i)=>`<div class="tree-box lvl-fi2"><div class="box-label">Fin ind. ${i+1}</div><textarea oninput="S.find_[${i}]=this.value;scheduleSave();patchLive()" placeholder="Fin indirecto…">${esc(v)}</textarea></div>`).join('')
    + '</div><div class="connector-v"></div>'
    + '<div class="tree-level-label" style="background:#2563eb;color:#fff">Fines directos</div>'
    + `<div class="tree-grid" style="grid-template-columns:repeat(${Math.max(S.fdir.length,1)},1fr)">`
    + S.fdir.map((v,i)=>boxRemovable(S.fdir,'fdir',i,'lvl-fi1','Fin dir.','Fin directo…','find_')).join('')
    + '</div>'
    + '<div style="margin:6px 0 4px"><button class="btn sm" onclick="addFinMedio(\'fin\')">+ Agregar fin</button></div>'
    + '<div class="connector-v"></div>'
    + '<div class="tree-level-label" style="background:var(--g1);color:#fff">🎯 OBJETIVO CENTRAL</div>'
    + `<div class="tree-box lvl-central"><div class="box-label">Objetivo central ${tipBtn('obj_central')}</div><textarea oninput="S.obj_central=this.value;scheduleSave();patchLive()" placeholder="Estado positivo alcanzado">${esc(S.obj_central)}</textarea></div>`
    + '<div class="connector-v"></div>'
    + '<div class="tree-level-label" style="background:#15803d;color:#fff">Medios directos (→ Resultados esperados)</div>'
    + `<div class="tree-grid" style="grid-template-columns:repeat(${Math.max(NMD,1)},1fr)">`
    + S.mdir.map((v,i)=>boxRemovable(S.mdir,'mdir',i,'lvl-med1','Medio dir.','Medio directo…','mind')).join('')
    + '</div>'
    + '<div style="margin:6px 0 4px"><button class="btn sm" onclick="addFinMedio(\'medio\')">+ Agregar medio</button></div>'
    + '<div class="connector-v"></div>'
    + '<div class="tree-level-label" style="background:#166534;color:#fff">Medios 2.° orden</div>'
    + `<div class="tree-grid" style="grid-template-columns:repeat(${Math.max(NMD,1)},1fr)">`
    + S.mdir.map((_,i) => {
        while(S.mind.length<=i) S.mind.push('');
        return `<div class="tree-box lvl-med2"><div class="box-label">Medio ind. ${i+1}</div><textarea oninput="S.mind[${i}]=this.value;scheduleSave();patchLive()" placeholder="Medio indirecto…">${esc(S.mind[i])}</textarea></div>`;
      }).join('')
    + '</div>'
    + '</div>'
  );
}

function addFinMedio(kind) {
  if (kind === 'fin') { S.fdir.push(''); S.find_.push(''); }
  else { S.mdir.push(''); S.mind.push(''); }
  scheduleSave(); render();
}
function removeFinMedio(key, idx, partnerKey) {
  S[key].splice(idx, 1);
  if (S[partnerKey] && S[partnerKey].length > idx) S[partnerKey].splice(idx, 1);
  scheduleSave(); render();
}

function renderS5() {
  function objetivoCard(o, idx) {
    const fw = (o.texto||'').split(' ')[0].toLowerCase();
    const badVerb = fw && VERBOS_NO.includes(fw);
    const numLabel = S.objetivos_esp.length > 1 ? ` ${idx+1}` : '';
    const canRemove = S.objetivos_esp.length > 1;
    return `<div style="border:1px solid var(--bdr2);border-radius:var(--r3);overflow:hidden;margin-bottom:14px">
      <div style="background:#0f766e;padding:9px 14px;display:flex;align-items:center;justify-content:space-between">
        <span style="color:#fff;font-size:13px;font-weight:600">OBJETIVO ESPECÍFICO${numLabel} (PROPÓSITO${numLabel}) ${tipBtn('obj_especifico')}</span>
        ${canRemove ? `<button onclick="removeObjetivoEspecifico(${idx})" title="Eliminar este objetivo específico" style="background:none;border:none;cursor:pointer;color:#fff;opacity:.8;font-size:18px;line-height:1;padding:0 4px">×</button>` : ''}
      </div>
      <div style="padding:14px">
        <div class="note info" style="margin-bottom:10px">Usa verbos que se puedan medir: <strong>${VERBOS_OK.slice(0,5).join(', ')}…</strong> Evita verbos vagos como: <em>${VERBOS_NO.join(', ')}</em></div>
        <textarea oninput="S.objetivos_esp[${idx}].texto=this.value;scheduleSave();patchLive()" placeholder="Ej: Mejorar las capacidades tecnológicas de 30 jóvenes rurales de Cumbal para el monitoreo hídrico">${esc(o.texto)}</textarea>
        ${badVerb ? `<div class="val-err">⚠ Verbo "${fw}" no es adecuado.</div>` : ''}

        <div style="margin-top:16px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)">Resultados / Productos del Objetivo${numLabel} ${tipBtn('resultado')}</div>
        <div class="note info" style="margin-top:6px">Cada resultado es algo concreto que el proyecto entrega — se escribe como algo ya terminado: <em>diseñado, implementado, capacitado, validado…</em></div>
        ${o.resultados.map((r,ri) =>
          `<div class="res-row"><div class="res-num">${ri+1}</div>`
          + `<input type="text" value="${esc(r)}" oninput="S.objetivos_esp[${idx}].resultados[${ri}]=this.value;scheduleSave();patchLive()" placeholder="Resultado ${ri+1}: estado alcanzado, ej: Sistema IoT diseñado y validado" style="flex:1">`
          + (o.resultados.length>1 ? `<button onclick="removeResultadoDe(${idx},${ri})" title="Eliminar" style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:18px;line-height:1;padding:0 6px;flex-shrink:0">×</button>` : '')
          + `</div>`
        ).join('')}
        <button class="btn sm" style="margin-top:6px" onclick="S.objetivos_esp[${idx}].resultados.push('');scheduleSave();render()">+ Resultado</button>
      </div>
    </div>`;
  }

  const multiplesObjetivos = S.objetivos_esp.length > 1;
  return card(`Objetivo${multiplesObjetivos?'s':''} específico${multiplesObjetivos?'s':''} y resultados`,
    '<div class="note info">'
    + 'Algunas convocatorias (SENA/CEPAL) usan un único objetivo específico. Otras (MGA-DNP, MinCiencias, SGR, Bancoldex, MinTIC) permiten <strong>varios</strong> — uno por cada causa directa o frente de intervención. '
    + 'Por defecto verás uno solo; usa el botón de abajo <strong>solo si tu convocatoria lo requiere</strong>.</div>'
    + S.objetivos_esp.map((o,idx) => objetivoCard(o, idx)).join('')
    + `<button class="btn" onclick="addObjetivoEspecifico()" style="width:100%;border-style:dashed">+ Agregar otro objetivo específico</button>`
  );
}

function removeResultadoDe(oIdx, rIdx) {
  const o = S.objetivos_esp[oIdx];
  const preview = (o.resultados[rIdx]||'').substring(0,40) || `Resultado ${rIdx+1}`;
  if (!confirm(`¿Eliminar "${preview}"?\n\nEsto también borrará su indicador, actividades, medio de verificación y supuesto asociados.`)) return;
  o.resultados.splice(rIdx, 1);
  if (Array.isArray(o.iov_resultados) && o.iov_resultados.length > rIdx) o.iov_resultados.splice(rIdx, 1);
  if (Array.isArray(o.actividades_struct) && o.actividades_struct.length > rIdx) o.actividades_struct.splice(rIdx, 1);
  if (Array.isArray(o.res_mv) && o.res_mv.length > rIdx) o.res_mv.splice(rIdx, 1);
  if (Array.isArray(o.res_sup) && o.res_sup.length > rIdx) o.res_sup.splice(rIdx, 1);
  scheduleSave(); render();
}

function renderS6() {
  const primerTexto = S.objetivos_esp[0].texto;
  const autoOG = primerTexto ? 'Contribuir a '+primerTexto.charAt(0).toLowerCase()+primerTexto.slice(1) : '';
  const algunResultado = S.objetivos_esp.some(o => (o.resultados||[]).some(r=>r));
  return card(`Objetivo general (Fin) ${tipBtn('obj_general')}`,
    (autoOG && !S.obj_general ? `<div class="note ok">Sugerencia: <em>${autoOG.substring(0,100)}…</em> <button class="btn sm" onclick="S.obj_general=${JSON.stringify(autoOG)};scheduleSave();patchLive()">Usar</button></div>` : '')
    + '<div class="note info">El objetivo general empieza siempre con <strong>"Contribuir a…"</strong> porque el proyecto solo no puede resolver todo — hace su parte para un cambio más grande en el territorio.</div>'
    + field('Objetivo general',
      `<textarea id="inp-obj-gen" oninput="S.obj_general=this.value;scheduleSave();patchLive()" placeholder="Contribuir a…">${esc(S.obj_general)}</textarea>`
    )
  ) + card(`Actividades por resultado esperado ${tipBtn('actividad')}`,
    `<div class="note info">Cada actividad debe comenzar con un sustantivo que describe la acción: <em>${SUSTANTIVOS_ACT.slice(0,6).join(', ')}…</em> Una actividad va amarrada a un solo resultado — no puede pertenecer a dos al mismo tiempo.</div>`
    + (!algunResultado ? '<div class="note warn">Define los resultados esperados en la Sesión 5 primero.</div>' :
      S.objetivos_esp.map((o, oi) => {
        const resultadosLlenos = (o.resultados||[]).filter(r=>r);
        if (!resultadosLlenos.length) return '';
        const numLabel = S.objetivos_esp.length > 1 ? ` ${oi+1}` : '';
        const bloques = (o.resultados||[]).map((r, ri) => {
          if (!r) return ''; // posición vacía: no tiene actividades aún, se omite visualmente
          if (!o.actividades_struct[ri]) o.actividades_struct[ri] = [];
          const acts = o.actividades_struct[ri];
          if (acts.length===0) acts.push('');
          const rlbl = `Resultado ${ri+1}`;
          return `<div style="border:1px solid var(--bdr2);border-radius:var(--r2);overflow:hidden;margin-bottom:12px">`
            + `<div style="background:var(--g1);padding:8px 12px;color:#fff;font-size:12px;font-weight:500">${rlbl}: ${r}</div>`
            + `<div style="padding:10px 12px">`
            + acts.map((a,ai) => {
                const fw2 = (a||'').split(' ')[0];
                const goodAct = !fw2 || SUSTANTIVOS_ACT.map(s=>s.toLowerCase()).includes(fw2.toLowerCase());
                return `<div class="act-row"><div class="act-code">${ai+1}</div><div style="flex:1">`
                  + `<input type="text" value="${esc(a)}" oninput="S.objetivos_esp[${oi}].actividades_struct[${ri}][${ai}]=this.value;scheduleSave();patchLive()" placeholder="${SUSTANTIVOS_ACT[ai%SUSTANTIVOS_ACT.length]} de…" style="border-color:${a&&!goodAct?'#fca5a5':''}">`
                  + (a && !goodAct ? `<div class="val-err">⚠ Inicie con sustantivo: ${SUSTANTIVOS_ACT.slice(0,4).join(', ')}…</div>` : '')
                  + `</div>`
                  + (acts.length>1 ? `<button class="btn sm" onclick="S.objetivos_esp[${oi}].actividades_struct[${ri}].splice(${ai},1);scheduleSave();render()" style="color:#dc2626;padding:5px 8px">×</button>` : '')
                  + `</div>`;
              }).join('')
            + `<button class="btn sm" style="margin-top:6px" onclick="S.objetivos_esp[${oi}].actividades_struct[${ri}]=S.objetivos_esp[${oi}].actividades_struct[${ri}]||[];S.objetivos_esp[${oi}].actividades_struct[${ri}].push('');scheduleSave();render()">+ Actividad para ${rlbl}</button>`
            + `</div>`
            + `<div style="background:var(--g4);padding:5px 12px;font-size:11px;color:var(--g1)">${acts.filter(a=>a).length} actividad(es) → ${rlbl}${acts.filter(a=>a).length===0?' <span style="color:#d97706">⚠ sin actividades</span>':''}</div>`
            + `</div>`;
        }).join('');
        return `<div style="margin-bottom:16px">`
          + `<div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:8px">Objetivo específico${numLabel}: ${(o.texto||'sin definir').substring(0,60)}${(o.texto||'').length>60?'…':''}</div>`
          + `<div style="padding-left:12px;border-left:2px solid var(--bdr)">${bloques}</div>`
          + `</div>`;
      }).join(''))
  );
}

function renderS7() {
  const rl = resLlenos();
  function iovRow(label, color, iov, keyBase) {
    const ok = iov.ind && iov.base && iov.meta && iov.plazo;
    const kb = keyBase;
    return `<div style="border:1px solid ${ok?'#86efac':'#fca5a5'};border-radius:var(--r2);overflow:hidden;margin-bottom:10px">`
      + `<div style="background:${color};padding:7px 12px;color:#fff;font-size:11px;font-weight:600">${label}</div>`
      + `<div style="padding:10px 12px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px">`
      + `<div><div class="lbl">Indicador ${tipBtn('indicador')}</div><textarea rows="2" oninput="${kb}.ind=this.value;scheduleSave();patchLive()" placeholder="Ej: Al mes 12, al menos 25 de los 30 jóvenes demuestran competencia en el uso del sistema mediante prueba práctica" style="min-height:54px">${esc(iov.ind||'')}</textarea></div>`
      + `<div><div class="lbl">Línea base ${tipBtn('iov_linea_base')}</div><input type="text" value="${esc(iov.base||'')}" oninput="${kb}.base=this.value;scheduleSave();patchLive()" placeholder="Ej: 0 usuarios capacitados al inicio"></div>`
      + `<div><div class="lbl">Meta</div><input type="text" value="${esc(iov.meta||'')}" oninput="${kb}.meta=this.value;scheduleSave();patchLive()" placeholder="Ej: 25 de 30 jóvenes capacitados"></div>`
      + `<div><div class="lbl">Plazo</div><input type="text" value="${esc(iov.plazo||'')}" oninput="${kb}.plazo=this.value;scheduleSave();patchLive()" placeholder="Ej: Mes 12"></div>`
      + `</div>`
      + (ok ? '<div style="background:var(--g3);padding:4px 12px;font-size:10px;color:var(--g1)">✓ Indicador completo</div>'
             : '<div style="background:#fef2f2;padding:4px 12px;font-size:10px;color:#dc2626">Completa los 4 campos</div>')
      + `</div>`;
  }
  function iovRowResultadoFijo(label, oi, ri) {
    const o = S.objetivos_esp[oi];
    if (!o.iov_resultados[ri]) o.iov_resultados[ri] = {ind:'',base:'',meta:'',plazo:''};
    const iov = o.iov_resultados[ri];
    const ok = iov.ind && iov.base && iov.meta && iov.plazo;
    const kb = `S.objetivos_esp[${oi}].iov_resultados[${ri}]`;
    return `<div style="border:1px solid ${ok?'#86efac':'#fca5a5'};border-radius:var(--r2);overflow:hidden;margin-bottom:10px">`
      + `<div style="background:#15803d;padding:7px 12px;color:#fff;font-size:11px;font-weight:600">${label}</div>`
      + `<div style="padding:10px 12px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px">`
      + `<div><div class="lbl">Indicador ${tipBtn('indicador')}</div><textarea rows="2" oninput="${kb}.ind=this.value;scheduleSave();patchLive()" placeholder="Ej: Al mes 12, al menos 25 de los 30 jóvenes demuestran competencia..." style="min-height:54px">${esc(iov.ind||'')}</textarea></div>`
      + `<div><div class="lbl">Línea base ${tipBtn('iov_linea_base')}</div><input type="text" value="${esc(iov.base||'')}" oninput="${kb}.base=this.value;scheduleSave();patchLive()" placeholder="Ej: 0 usuarios al inicio"></div>`
      + `<div><div class="lbl">Meta</div><input type="text" value="${esc(iov.meta||'')}" oninput="${kb}.meta=this.value;scheduleSave();patchLive()" placeholder="Ej: 25 de 30"></div>`
      + `<div><div class="lbl">Plazo</div><input type="text" value="${esc(iov.plazo||'')}" oninput="${kb}.plazo=this.value;scheduleSave();patchLive()" placeholder="Ej: Mes 12"></div>`
      + `</div>`
      + (ok ? '<div style="background:var(--g3);padding:4px 12px;font-size:10px;color:var(--g1)">✓ Indicador completo</div>'
             : '<div style="background:#fef2f2;padding:4px 12px;font-size:10px;color:#dc2626">Completa los 4 campos</div>')
      + `</div>`;
  }
  const multiples = S.objetivos_esp.length > 1;
  const algunResultado = S.objetivos_esp.some(o => (o.resultados||[]).some(r=>r));
  return card(`Indicadores objetivamente verificables (IOV) ${tipBtn('indicador')}`,
    '<div class="note info">Un buen indicador le dice a cualquier persona —sin conocer el proyecto— si se cumplió o no. Debe tener: cuántos, quiénes, en qué plazo y de dónde se parte.</div>'
    + S.objetivos_esp.map((o,oi) => {
        const propHtml = iovRow(
          `OBJ. ESP.${multiples?' '+(oi+1):''} (PROPÓSITO${multiples?' '+(oi+1):''}) — ${(o.texto||'sin definir').substring(0,50)}`,
          '#0f766e', o.iov, `S.objetivos_esp[${oi}].iov`
        );
        const resHtml = (o.resultados||[]).map((r,ri) => {
          if (!r) return '';
          return iovRowResultadoFijo(`Resultado ${ri+1}: ${r.substring(0,45)}${r.length>45?'…':''}`, oi, ri);
        }).join('');
        return propHtml + (resHtml ? `<div style="padding-left:14px;border-left:2px solid var(--bdr);margin-bottom:6px">${resHtml}</div>` : '');
      }).join('')
    + (!algunResultado ? '<div class="note warn">Define los resultados en S5 para ver sus indicadores aquí.</div>' : '')
  );
}

function renderS8() {
  const rl = resLlenos();
  function mvSupRow(color, badge, narrative, mvVal, mvKey, supVal, supKey, indHint) {
    return `<div style="border:1px solid var(--bdr2);border-radius:var(--r2);overflow:hidden;margin-bottom:10px">`
      + `<div style="background:${color};padding:7px 12px;color:#fff;font-size:11px;font-weight:600">${badge}</div>`
      + `<div style="padding:8px 12px;font-size:12px;color:var(--ink3);background:var(--bg)">${narrative||'—'}</div>`

      + `<div><div class="lbl">Medio de verificación ${tipBtn('medver')}</div><textarea rows="2" oninput="${mvKey}=this.value;scheduleSave();patchLive()" placeholder="Ej: Acta de evaluación firmada, registro fotográfico, lista de asistencia con cédulas">${esc(mvVal)}</textarea></div>`
      + `<div><div class="lbl">Supuesto ${tipBtn('supuesto')}</div><textarea rows="2" oninput="${supKey}=this.value;scheduleSave();patchLive()" placeholder="Ej: La comunidad mantiene su disposición a participar durante todo el proyecto">${esc(supVal)}</textarea></div>`

      + `<div style="padding:8px 12px;font-size:12px;color:var(--ink3);background:var(--bg)">${narrative||'—'}</div>`
      + (indHint ? `<div style="padding:4px 12px;font-size:11px;color:var(--ink3);background:var(--bdr2)">IOV: ${indHint}</div>` : '')
      + `<div style="padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">`

      + `</div></div>`;

    '<div class="note info">El medio de verificación es el documento o registro donde alguien puede comprobar que el resultado se logró — no puede ser solo la palabra del equipo. El supuesto es una condición externa que el proyecto no controla pero que necesita que se cumpla.</div>'

      + `<div style="display:none"><table style="width:100%;border-collapse:collapse;font-size:11px">`

            + `<td style="border:1px solid var(--bdr);padding:3px"><select onchange="S.presupuesto_v2.find(r=>r.id==='${rid}').items[${ii}].act=this.value;scheduleSave();patchLive()" style="font-size:10px;width:100%"><option value="">—</option>${actOptions.replace(/selected/g,'').replace(`value="${it.act}"`,`value="${it.act}" selected`)}</select></td>`
            + `<td style="border:1px solid var(--bdr);padding:3px;text-align:center"><input type="number" value="${it.cant||1}" min="0" oninput="S.presupuesto_v2.find(r=>r.id==='${rid}').items[${ii}].cant=this.value;scheduleSave();patchLive()" style="font-size:11px;width:44px;text-align:center"></td>`

      + `<div style="padding:10px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">`
      + `<div><div class="lbl">Descripción ${tipBtn('riesgo')}</div><textarea rows="2" oninput="S.riesgos[${i}].desc=this.value;scheduleSave();patchLive()" placeholder="Ej: El prototipo no alcanza la precisión técnica requerida en condiciones de campo">${esc(r.desc||'')}</textarea></div>`
      + `<div><div class="lbl">Mitigación</div><textarea rows="2" oninput="S.riesgos[${i}].mit=this.value;scheduleSave();patchLive()" placeholder="Ej: Pruebas de laboratorio con protocolo escalonado antes de la implementación en campo">${esc(r.mit||'')}</textarea></div>`
      + `<div><div class="lbl">Contingencia</div><textarea rows="2" oninput="S.riesgos[${i}].cont=this.value;scheduleSave();patchLive()" placeholder="Ej: Ajuste del diseño con asesoría técnica especializada, sin afectar el cronograma principal">${esc(r.cont||'')}</textarea></div>`
      + `</div>`
      + (S.riesgos.length>1 ? `<div style="padding:0 12px 8px;text-align:right"><button class="btn sm" onclick="S.riesgos.splice(${i},1);scheduleSave();render()" style="color:#dc2626">Eliminar</button></div>` : '')

    + presHtml

    + riesgosHtml

function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function card(title, content) {
  return '<div class="card"><div class="card-title">'+title+'</div>'+content+'</div>';
}
function field(label, input, hint) {
  return '<div class="field"><label class="lbl">'+label+'</label>'+input+(hint?'<div style="font-size:11px;color:var(--ink3);margin-top:3px">'+hint+'</div>':'')+' </div>';
}
function fieldRow2(...fields) { return '<div class="field-row cols2">'+fields.join('')+'</div>'; }
function fieldRow3(...fields) { return '<div class="field-row cols3">'+fields.join('')+'</div>'; }

// ═══════════════════════════════════════════════════════════════
// PDF EXPORT — texto vectorial real (copiable), NUNCA una imagen
// rasterizada. Se genera directamente desde S, no desde el DOM,
// así que incluye TODAS las secciones diligenciadas del proyecto
// (igual que el Excel), no solo la Matriz MML.
//
// Regla de fondo (misma que ya seguíamos en la app): las Actividades
// NO llevan columnas de Indicador/Medio de verificación/Supuesto en
// la Matriz MML clásica — por eso viven en una sección aparte,
// "Cadena de ejecución", como un árbol anidado Objetivo → Resultado
// → Actividad, para no saturar la matriz con filas que no le
// corresponden según los fundamentos de Marco Lógico.
// ═══════════════════════════════════════════════════════════════
function pdfBuildDoc() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const MG = 14;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const CW = pageW - MG * 2; // ancho útil
  let y = MG;

  const COLORS = {
    g1: [26, 92, 56], g2: [45, 122, 79], ink: [26, 26, 24], ink2: [74, 74, 69], ink3: [138, 138, 130],
    fi: [239, 246, 255], prop: [240, 253, 244], res: [255, 255, 255], pre: [254, 243, 199],
    tanText: [146, 64, 14], white: [255, 255, 255]
  };

  function checkSpace(need) {
    if (y + need > pageH - MG) { doc.addPage(); y = MG; }
  }

  function h1(text) {
    checkSpace(12);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...COLORS.g1);
    doc.text(text, MG, y);
    y += 2;
    doc.setDrawColor(226, 232, 224); doc.setLineWidth(0.3);
    doc.line(MG, y, pageW - MG, y);
    y += 6;
  }

  function paragraph(text, opts = {}) {
    if (!text) return;
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    doc.setFontSize(opts.size || 10);
    doc.setTextColor(...(opts.color || COLORS.ink2));
    const lines = doc.splitTextToSize(text, CW);
    lines.forEach(line => {
      checkSpace(5.5);
      doc.text(line, MG, y);
      y += 5;
    });
    y += opts.gap != null ? opts.gap : 3;
  }

  function nivelRowStyle(nivel) {
    if (/^FIN/.test(nivel)) return COLORS.fi;
    if (/OBJ\. ESP|PROP[ÓO]SITO/.test(nivel)) return COLORS.prop;
    if (/Resultado/.test(nivel)) return COLORS.res;
    if (/PRECONDICI/.test(nivel)) return COLORS.pre;
    return COLORS.white;
  }

  function table(head, rows, opts = {}) {
    if (!rows.length) return;
    doc.autoTable({
      startY: y,
      margin: { left: MG, right: MG },
      head: [head],
      body: rows,
      theme: 'grid',
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 2.2, textColor: COLORS.ink, lineColor: [226,232,224], lineWidth: 0.2, valign: 'top' },
      headStyles: { fillColor: COLORS.g1, textColor: 255, fontSize: 8.5, fontStyle: 'bold' },
      columnStyles: opts.columnStyles || {},
      didParseCell: opts.didParseCell,
    });
    y = doc.lastAutoTable.finalY + 7;
  }

  // ── Portada ──
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(217, 119, 6);
  doc.text('JÓVENES EN CIENCIA PARA LA PAZ – CAPÍTULO IPIALES', MG, y); y += 7;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(...COLORS.g1);
  doc.splitTextToSize(S.titulo || 'Sin título', CW).forEach(line => { doc.text(line, MG, y); y += 6.5; });
  y += 1;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...COLORS.ink2);
  doc.text([S.f1, S.f2, S.f3].filter(Boolean).join(' · ') || '—', MG, y); y += 5.5;
  doc.setFontSize(9); doc.setTextColor(...COLORS.ink3);
  doc.text('Municipios: ' + (S.municipios.join(', ') || '—') + '   ·   Duración: ' + (S.duracion || '—') + ' meses', MG, y);
  y += 9;

  if (S.resumen) { h1('Resumen ejecutivo'); paragraph(S.resumen); }

  // ── 1. Árbol de problemas ──
  h1('1. Árbol de problemas');
  {
    const rows = [];
    S.efind.filter(Boolean).forEach(v => rows.push(['Efecto 2.º orden', v]));
    S.efdir.filter(Boolean).forEach(v => rows.push(['Efecto directo', v]));
    if (S.problema) rows.push(['PROBLEMA CENTRAL', S.problema]);
    S.cadir.filter(Boolean).forEach(v => rows.push(['Causa directa', v]));
    S.caind.filter(Boolean).forEach(v => rows.push(['Causa 2.º orden', v]));
    table(['Nivel', 'Descripción'], rows, {
      columnStyles: { 0: { cellWidth: 38, fontStyle: 'bold', fontSize: 8 } },
      didParseCell: (d) => {
        if (d.section === 'body') {
          const nivel = d.row.raw[0];
          const c = /PROBLEMA/.test(nivel) ? [232,245,238] : /Efecto/.test(nivel) ? [239,246,255] : [255,251,235];
          d.cell.styles.fillColor = c;
        }
      }
    });
  }

  // ── 2. Árbol de objetivos ──
  h1('2. Árbol de objetivos');
  {
    const rows = [];
    S.find_.filter(Boolean).forEach(v => rows.push(['Fin 2.º orden', v]));
    S.fdir.filter(Boolean).forEach(v => rows.push(['Fin directo', v]));
    if (S.obj_central) rows.push(['OBJETIVO CENTRAL', S.obj_central]);
    S.mdir.filter(Boolean).forEach(v => rows.push(['Medio directo', v]));
    S.mind.filter(Boolean).forEach(v => rows.push(['Medio 2.º orden', v]));
    table(['Nivel', 'Descripción'], rows, {
      columnStyles: { 0: { cellWidth: 38, fontStyle: 'bold', fontSize: 8 } },
      didParseCell: (d) => {
        if (d.section === 'body') {
          const nivel = d.row.raw[0];
          const c = /OBJETIVO CENTRAL/.test(nivel) ? [232,245,238] : /Fin/.test(nivel) ? [239,246,255] : [220,252,231];
          d.cell.styles.fillColor = c;
        }
      }
    });
  }

  // ── 3. Objetivos (general + específicos + resultados) ──
  h1('3. Objetivos');
  {
    const rows = [['Objetivo general', S.obj_general || '—']];
    const multiples = S.objetivos_esp.length > 1;
    S.objetivos_esp.forEach((o, oi) => {
      rows.push(['Objetivo específico' + (multiples ? ' ' + (oi + 1) : ''), o.texto || '—']);
      (o.resultados || []).forEach((r, ri) => { if (r) rows.push(['   Resultado ' + (ri + 1), r]); });
    });
    table(['Nivel', 'Descripción'], rows, {
      columnStyles: { 0: { cellWidth: 42, fontStyle: 'bold', fontSize: 8 } }
    });
  }

  // ── 3b. Cadena de ejecución: Objetivo → Resultado → Actividad ──
  // (Fuera de la Matriz MML a propósito: la Actividad no lleva IOV/MV/Supuesto)
  const hayActividades = S.objetivos_esp.some(o => (o.actividades_struct || []).some(arr => (arr || []).some(a => a)));
  if (hayActividades) {
    h1('Cadena de ejecución (Objetivo - Resultado - Actividad)');
    paragraph('Muestra cómo se despliega cada Objetivo Específico en sus Resultados y Actividades. Las Actividades no llevan indicador, medio de verificación ni supuesto propios — eso solo aplica al Fin, al Propósito y a los Resultados en la Matriz MML.', { size: 8.5, color: COLORS.ink3, gap: 4 });
    const multiples = S.objetivos_esp.length > 1;
    S.objetivos_esp.forEach((o, oi) => {
      const tieneAlgo = (o.resultados || []).some(r => r);
      if (!tieneAlgo) return;
      checkSpace(8);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...COLORS.g1);
      doc.text('Objetivo específico' + (multiples ? ' ' + (oi + 1) : '') + ': ' + (o.texto || 'sin definir'), MG, y, { maxWidth: CW });
      y += doc.splitTextToSize(o.texto || 'sin definir', CW - 45).length * 5 + 3;

      (o.resultados || []).forEach((r, ri) => {
        if (!r) return;
        checkSpace(7);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(21, 128, 61);
        const rLines = doc.splitTextToSize('• Resultado ' + (ri + 1) + ': ' + r, CW - 6);
        rLines.forEach(l => { checkSpace(5); doc.text(l, MG + 6, y); y += 4.6; });

        const acts = ((o.actividades_struct || [])[ri] || []).filter(a => a);
        acts.forEach((a, ai) => {
          checkSpace(5);
          doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...COLORS.ink2);
          const aLines = doc.splitTextToSize('– Actividad ' + (ai + 1) + ': ' + a, CW - 16);
          aLines.forEach(l => { checkSpace(4.5); doc.text(l, MG + 14, y); y += 4.2; });
        });
        y += 1.5;
      });
      y += 3;
    });
    y += 2;
  }

  // ── 4. Matriz de Marco Lógico (Fin / Propósito(s) / Resultados — SIN actividades) ──
  h1('4. Matriz de Marco Lógico');
  {
    const rows = [];
    rows.push(['FIN', S.obj_general || '—', S.fin_ind || '—', S.fin_mv || '—', S.fin_sup || '—']);
    const multiples = S.objetivos_esp.length > 1;
    S.objetivos_esp.forEach((o, oi) => {
      const nivelProp = 'OBJ. ESP.' + (multiples ? ' ' + (oi + 1) : '') + ' (PROPÓSITO' + (multiples ? ' ' + (oi + 1) : '') + ')';
      const iovProp = o.iov.ind ? (o.iov.ind + '\nBase: ' + (o.iov.base || '—') + ' -> Meta: ' + (o.iov.meta || '—') + ' -> ' + (o.iov.plazo || '—')) : '—';
      rows.push([nivelProp, o.texto || '—', iovProp, o.mv || '—', o.sup || '—']);
      (o.resultados || []).forEach((r, ri) => {
        if (!r) return;
        const iov = (o.iov_resultados[ri]) || {};
        const iovTxt = iov.ind ? (iov.ind + '\nBase: ' + (iov.base || '—') + ' -> ' + (iov.meta || '—') + ' -> ' + (iov.plazo || '—')) : '—';
        rows.push(['   Resultado ' + (ri + 1), r, iovTxt, (o.res_mv || [])[ri] || '—', (o.res_sup || [])[ri] || '—']);
      });
    });
    doc.autoTable({
      startY: y,
      margin: { left: MG, right: MG },
      head: [['Nivel', 'Resumen narrativo', 'Indicador (IOV)', 'Medio de verificación', 'Supuesto']],
      body: rows,
      theme: 'grid',
      styles: { font: 'helvetica', fontSize: 8, cellPadding: 2, textColor: COLORS.ink, lineColor: [226,232,224], lineWidth: 0.2, valign: 'top' },
      headStyles: { fillColor: COLORS.g1, textColor: 255, fontSize: 8, fontStyle: 'bold' },
      columnStyles: { 0: { cellWidth: 24, fontStyle: 'bold', fontSize: 7.5 }, 1: { cellWidth: 50 }, 2: { cellWidth: 46 }, 3: { cellWidth: 34 }, 4: { cellWidth: 28 } },
      didParseCell: (d) => {
        if (d.section === 'body') d.cell.styles.fillColor = nivelRowStyle(d.row.raw[0]);
      }
    });
    y = doc.lastAutoTable.finalY + 6;
  }

  if (S.precondiciones) {
    checkSpace(10);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...COLORS.tanText);
    doc.text('Precondiciones:', MG, y); y += 4.5;
    paragraph(S.precondiciones, { size: 9 });
  }

  // ── 5. Presupuesto por rubros SENA ──
  const hayPresupuesto = (S.presupuesto_v2 || []).some(rb => (rb.items || []).some(it => it.desc));
  if (hayPresupuesto) {
    h1('5. Presupuesto por rubros SENA');
    (S.presupuesto_v2 || []).forEach(rb => {
      const meta = RUBROS_SENA.find(r => r.id === rb.id) || { label: rb.id };
      const items = (rb.items || []).filter(it => it.desc);
      if (!items.length) return;
      checkSpace(8);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...COLORS.g1);
      doc.text(meta.label, MG, y); y += 4.5;
      const rows = items.map(it => {
        const tot = Math.round((parseFloat(it.cant) || 0) * (parseFloat(it.tiempo) || 1) * (parseFloat(it.unit) || 0));
        return [it.desc || '—', it.act || '—', String(it.cant || 1), String(it.tiempo || 1), '$' + (parseFloat(it.unit) || 0).toLocaleString('es-CO'), '$' + tot.toLocaleString('es-CO'), it.just || '—'];
      });
      doc.autoTable({
        startY: y, margin: { left: MG, right: MG },
        head: [['Descripción', 'Act.', 'Cant.', 'Meses', 'V. unit.', 'Total', 'Justificación']],
        body: rows, theme: 'grid',
        styles: { font: 'helvetica', fontSize: 7.8, cellPadding: 1.8, valign: 'top' },
        headStyles: { fillColor: [45, 122, 79], textColor: 255, fontSize: 7.8 },
        columnStyles: { 1: { cellWidth: 16 }, 2: { cellWidth: 13 }, 3: { cellWidth: 13 }, 4: { cellWidth: 20 }, 5: { cellWidth: 20 } }
      });
      y = doc.lastAutoTable.finalY + 5;
    });
    checkSpace(9);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...COLORS.g1);
    doc.text('TOTAL GENERAL: $' + Math.round(calcGrandTotal()).toLocaleString('es-CO'), MG, y);
    y += 9;
  }

  // ── 6. Riesgos ──
  const hayRiesgos = (S.riesgos || []).some(r => r.desc);
  if (hayRiesgos) {
    h1('6. Gestión de riesgos');
    const rows = S.riesgos.filter(r => r.desc).map(r => [r.tipo || '—', r.prob || '—', r.imp || '—', r.desc || '—', r.mit || '—', r.cont || '—']);
    table(['Tipo', 'Prob.', 'Impacto', 'Descripción', 'Mitigación', 'Contingencia'], rows, {
      columnStyles: { 0: { cellWidth: 20 }, 1: { cellWidth: 16 }, 2: { cellWidth: 16 } }
    });
  }

  // ── 7. Sostenibilidad e impactos ──
  const haySost = [S.sos_amb, S.sos_soc, S.sos_cap, S.imp_form, S.imp_soc, S.imp_amb, S.imp_tec].some(Boolean);
  if (haySost) {
    h1('7. Sostenibilidad e impactos esperados');
    const bloques = [
      ['Sostenibilidad ambiental', S.sos_amb], ['Sostenibilidad social', S.sos_soc], ['Continuidad institucional', S.sos_cap],
      ['Impacto en formación', S.imp_form], ['Impacto social', S.imp_soc], ['Impacto ambiental', S.imp_amb], ['Impacto tecnológico', S.imp_tec]
    ];
    bloques.forEach(([label, val]) => {
      if (!val) return;
      checkSpace(8);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...COLORS.g1);
      doc.text(label + ':', MG, y); y += 4.3;
      paragraph(val, { size: 9 });
    });
  }

  // ── Numeración de páginas ──
  const total = doc.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(160, 160, 160);
    doc.text('Página ' + p + ' de ' + total, pageW / 2, pageH - 6, { align: 'center' });
  }

  return doc;
}

function exportPDF() {
  showToast('Generando PDF…');
  try {
    const doc = pdfBuildDoc();
    doc.save(((S.titulo || 'FormuladorMML').replace(/[^a-zA-Z0-9]/g, '_').substring(0, 40)) + '_MML.pdf');
    showToast('PDF descargado ✓ (texto real, copiable)', 'green');
  } catch (e) { showToast('Error: ' + e.message, ''); }
}

function exportJSON() {
  const blob=new Blob([JSON.stringify({data:S,exportado:new Date().toLocaleString('es-CO')},null,2)],{type:'application/json'});
