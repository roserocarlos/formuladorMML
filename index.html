// ═══════════════════════════════════════════════════════════════
// CARGAR DESDE EXCEL — convierte una plantilla .xlsx del Formulador
// MML (misma estructura que el Excel descargable) directamente al
// estado S de la app. Lee por ETIQUETA DE TEXTO, no por coordenada
// fija, para tolerar variaciones razonables entre versiones de la
// plantilla (ej. distinto número de resultados por objetivo).
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
// Parser de Excel -> estructura S del Formulador MML.
// Lee por ETIQUETA DE TEXTO (columna B), no por coordenada fija de
// celda, para no romperse si la plantilla trae más o menos filas
// (ej. 2 resultados vs 3 resultados por objetivo).
// ═══════════════════════════════════════════════════════════════

function xlAOA(wb, sheetName) {
  const ws = wb.Sheets[sheetName];
  if (!ws) return null;
  // OJO: sheet_to_json recorta la columna A del array si está vacía en TODA
  // la hoja (ej. "0. Portada", donde las etiquetas empiezan en B) — eso
  // desplazaría todos los índices en 1. Forzamos el rango completo desde
  // A1 para que la columna A siempre sea el índice 0, sin importar si
  // tiene contenido o no.
  const ref = ws['!ref'] || 'A1:A1';
  const range = XLSX.utils.decode_range(ref);
  range.s.c = 0; // forzar inicio en columna A
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, range: XLSX.utils.encode_range(range) });
}

function xlNorm(v) {
  return String(v == null ? '' : v).trim();
}

function xlLooksLikeGuide(v) {
  const t = xlNorm(v);
  if (!t) return true;
  if (t.startsWith('📝') || t.startsWith('Ej:') || t.startsWith('Ej.')) return true;
  if (/…$/.test(t)) return true; // el texto guía de esta plantilla siempre termina en elipsis
  if (/^(Alta|Alto) \/ (Media|Medio) \/ (Baja|Bajo)$/.test(t)) return true; // placeholder de Riesgos
  return false;
}

function xlParseIdentificacion(wb, LINEAS, MUNICIPIOS) {
  const out = { titulo: '', f1: '', f2: '', f3: '', linea: '', sublinea: '', municipios: [], duracion: '', palabras: '' };
  let aoa = xlAOA(wb, '0. Portada');
  // Índices de ARRAY (0-based) = fila de Excel - 1. Columna 1 = B (etiqueta), columna 2 = C (valor).
  let map = { titulo: 7, f1: 9, f2: 10, f3: 11, linea: 13, sublinea: 14, municipios: 16, duracion: 17, palabras: 20 };
  const portadaVacia = !aoa || !xlNorm((aoa[map.titulo] || [])[2]);
  if (portadaVacia) {
    aoa = xlAOA(wb, '1. Identificación');
    map = { titulo: 4, f1: 9, f2: 10, f3: 11, linea: 5, sublinea: 6, municipios: 7, duracion: 13, palabras: 17 };
  }
  if (!aoa) return out;
  const get = (r) => xlNorm((aoa[r] || [])[2]);

  out.titulo = get(map.titulo);
  out.f1 = get(map.f1);
  out.f2 = get(map.f2);
  out.f3 = get(map.f3);
  out.sublinea = get(map.sublinea);
  out.duracion = String(get(map.duracion)).replace(/[^0-9]/g, '') || '';
  out.palabras = get(map.palabras);

  const lineaTxt = get(map.linea).toLowerCase();
  if (lineaTxt && !lineaTxt.includes('/')) { // en la guía sin llenar viene la lista completa con "/"
    const found = LINEAS.find(l => lineaTxt.includes(l.label.toLowerCase()) || l.label.toLowerCase().includes(lineaTxt));
    if (found) out.linea = found.id;
  }

  const muniTxt = get(map.municipios);
  if (muniTxt && !xlLooksLikeGuide(muniTxt) && muniTxt.split(',').length < MUNICIPIOS.length) {
    out.municipios = muniTxt.split(/[,/]/).map(s => s.trim()).filter(s => MUNICIPIOS.includes(s));
  }
  return out;
}

function xlParseArboles(wb) {
  const out = { efdir: [], efind: [], cadir: [], caind: [], problema: '', fdir: [], find_: [], mdir: [], mind: [], obj_central: '' };
  const prob = xlAOA(wb, '2. Árbol de Problemas');
  const obje = xlAOA(wb, '3. Árbol de Objetivos');

  function collect(aoa, prefix, arr) {
    if (!aoa) return;
    for (let r = 0; r < aoa.length; r++) {
      const label = xlNorm((aoa[r] || [])[1]);
      if (new RegExp('^' + prefix + ' \\d+$', 'i').test(label)) {
        const val = xlNorm((aoa[r] || [])[2]);
        if (val && !xlLooksLikeGuide(val)) arr.push(val);
      }
    }
  }
  collect(prob, 'Efecto indirecto', out.efind);
  collect(prob, 'Efecto directo', out.efdir);
  collect(prob, 'Causa directa', out.cadir);
  collect(prob, 'Causa indirecta', out.caind);
  collect(obje, 'Fin indirecto', out.find_);
  collect(obje, 'Fin directo', out.fdir);
  collect(obje, 'Medio directo', out.mdir);
  collect(obje, 'Medio indirecto', out.mind);

  if (prob) {
    for (let r = 0; r < prob.length; r++) {
      if (xlNorm((prob[r] || [])[1]) === 'PROBLEMA CENTRAL') {
        const val = xlNorm((prob[r] || [])[2]);
        if (val && !xlLooksLikeGuide(val)) out.problema = val;
      }
    }
  }
  if (obje) {
    for (let r = 0; r < obje.length; r++) {
      if (xlNorm((obje[r] || [])[1]) === 'OBJETIVO CENTRAL') {
        const val = xlNorm((obje[r] || [])[2]);
        if (val && !xlLooksLikeGuide(val)) out.obj_central = val;
      }
    }
  }
  // Asegurar mínimo 3 casillas por nivel (como espera la app)
  ['efdir', 'efind', 'cadir', 'caind', 'fdir', 'find_', 'mdir', 'mind'].forEach(k => {
    while (out[k].length < 3) out[k].push('');
  });
  return out;
}

function xlParseObjGeneral(wb) {
  const aoa = xlAOA(wb, '4. Objetivos');
  if (!aoa) return '';
  for (let r = 0; r < aoa.length; r++) {
    if (xlNorm((aoa[r] || [])[1]) === 'OBJETIVO GENERAL (FIN)') {
      const val = xlNorm((aoa[r] || [])[2]);
      if (val && !xlLooksLikeGuide(val)) return val;
    }
  }
  return '';
}

// Lee "5. Matriz MML" (estructura + narrativo + IOV + MV + supuesto) y
// "6. Indicadores IOV" (línea base / meta / plazo) y las combina por
// posición (mismo orden: Propósito, luego sus Resultados, repetido por
// cada Objetivo Específico).
function xlParseMatrizYObjetivos(wb) {
  const result = { objetivos_esp: [], fin_ind: '', fin_mv: '', fin_sup: '', precondiciones: '' };
  const mml = xlAOA(wb, '5. Matriz MML');
  const iov = xlAOA(wb, '6. Indicadores IOV');
  if (!mml) return result;

  // ── 1) Estructura + narrativo + IOV/MV/Supuesto desde "5. Matriz MML" ──
  const bloques = []; // [{ texto, ind, mv, sup, resultados:[{texto,ind,mv,sup}] }]
  let actual = null;
  for (let r = 0; r < mml.length; r++) {
    const row = mml[r] || [];
    const nivel = xlNorm(row[1]).replace(/\n/g, ' ');
    const narrativo = xlNorm(row[2]);
    const ind = xlNorm(row[4]);
    const mv = xlNorm(row[5]);
    const sup = xlNorm(row[6]);

    if (/^FIN\b/i.test(nivel)) {
      if (ind && !xlLooksLikeGuide(ind)) result.fin_ind = ind;
      if (mv && !xlLooksLikeGuide(mv)) result.fin_mv = mv;
      if (sup && !xlLooksLikeGuide(sup)) result.fin_sup = sup;
      continue;
    }
    if (/^OBJ\.?\s*ESP/i.test(nivel)) {
      actual = {
        texto: !xlLooksLikeGuide(narrativo) ? narrativo : '',
        ind: !xlLooksLikeGuide(ind) ? ind : '',
        mv: !xlLooksLikeGuide(mv) ? mv : '',
        sup: !xlLooksLikeGuide(sup) ? sup : '',
        resultados: []
      };
      bloques.push(actual);
      continue;
    }
    if (/^↳/.test(nivel) && actual) {
      actual.resultados.push({
        texto: !xlLooksLikeGuide(narrativo) ? narrativo : '',
        ind: !xlLooksLikeGuide(ind) ? ind : '',
        mv: !xlLooksLikeGuide(mv) ? mv : '',
        sup: !xlLooksLikeGuide(sup) ? sup : ''
      });
      continue;
    }
    if (/^PRE-?\s*COND/i.test(nivel)) {
      if (narrativo && !xlLooksLikeGuide(narrativo)) result.precondiciones = narrativo;
    }
  }

  // ── 2) Línea base / meta / plazo desde "6. Indicadores IOV" (mismo orden) ──
  const bloquesIov = [];
  let actualIov = null;
  if (iov) {
    for (let r = 0; r < iov.length; r++) {
      const row = iov[r] || [];
      const marcador = xlNorm(row[0]);
      const base = xlNorm(row[3]);
      const meta = xlNorm(row[4]);
      const plazo = xlNorm(row[5]);
      const esFilaConDatos = base || meta || plazo || xlNorm(row[1]) || xlNorm(row[2]);
      if (!esFilaConDatos) continue;
      if (marcador) {
        actualIov = { base, meta, plazo, resultados: [] };
        bloquesIov.push(actualIov);
      } else if (actualIov) {
        actualIov.resultados.push({ base, meta, plazo });
      }
    }
  }

  // ── 3) Combinar por posición en objetivos_esp con el esquema de la app ──
  bloques.forEach((b, oi) => {
    const iovB = bloquesIov[oi] || { base: '', meta: '', plazo: '', resultados: [] };
    const o = {
      id: oi + 1,
      texto: b.texto,
      resultados: b.resultados.map(r => r.texto),
      iov: { ind: b.ind, base: iovB.base || '', meta: iovB.meta || '', plazo: iovB.plazo || '' },
      iov_resultados: b.resultados.map((r, ri) => ({
        ind: r.ind, base: (iovB.resultados[ri] || {}).base || '',
        meta: (iovB.resultados[ri] || {}).meta || '', plazo: (iovB.resultados[ri] || {}).plazo || ''
      })),
      mv: b.mv, sup: b.sup,
      res_mv: b.resultados.map(r => r.mv),
      res_sup: b.resultados.map(r => r.sup),
      actividades_struct: b.resultados.map(() => [])
    };
    result.objetivos_esp.push(o);
  });

  return result;
}

const XL_RUBRO_LABELS = {
  'RECURSO HUMANO': 'rh', 'MATERIALES E INSUMOS': 'mi', 'CONSULTORÍAS Y ASESORÍAS': 'ca',
  'MAQUINARIA Y EQUIPOS': 'maq', 'TIC': 'tic', 'TRANSFERENCIA DE TECNOLOGÍA': 'tt', 'SERVICIOS EXTERNOS': 'se'
};

function xlParsePresupuesto(wb, RUBROS_SENA) {
  const porRubro = {}; RUBROS_SENA.forEach(r => porRubro[r.id] = []);
  const aoa = xlAOA(wb, '7. Presupuesto');
  if (!aoa) return RUBROS_SENA.map(r => ({ id: r.id, items: [] }));

  let rubroActual = null;
  for (let r = 0; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const b = xlNorm(row[1]);
    const bUpper = b.toUpperCase();
    if (XL_RUBRO_LABELS[bUpper]) { rubroActual = XL_RUBRO_LABELS[bUpper]; continue; }
    if (!b || /^SUBTOTAL/i.test(b) || /^TOTAL GENERAL/i.test(b)) continue;
    if (!rubroActual) continue;

    const c = xlNorm(row[2]);
    const d = xlNorm(row[3]);
    const e = parseFloat(row[4]);
    const f = parseFloat(row[5]);
    const g = parseFloat(row[6]);
    const i = xlNorm(row[8]);
    // Puede que el usuario haya usado C como justificación (en vez de I) — se toma la que exista.
    const just = i || (c && !/^\p{Emoji}/u.test(c) ? c : '');

    porRubro[rubroActual].push({
      desc: b, act: d || '', cant: isFinite(e) ? e : 1, tiempo: isFinite(f) ? f : 1,
      unit: isFinite(g) ? g : 0, just: just
    });
  }
  return RUBROS_SENA.map(r => ({ id: r.id, items: porRubro[r.id] }));
}

function xlParseRiesgos(wb) {
  const aoa = xlAOA(wb, '8. Riesgos');
  if (!aoa) return [{ tipo: 'Técnico', desc: '', prob: 'Media', imp: 'Alto', mit: '', cont: '' }];
  const tipos = ['Técnico', 'Financiero', 'Administrativo', 'Externo', 'Legal'];
  const out = [];
  for (let r = 0; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const tipo = xlNorm(row[1]);
    if (!tipos.includes(tipo)) continue;
    const desc = xlNorm(row[2]);
    if (!desc || xlLooksLikeGuide(desc)) continue;
    const prob = xlNorm(row[3]); const imp = xlNorm(row[4]);
    out.push({
      tipo,
      desc,
      prob: ['Alta', 'Media', 'Baja'].includes(prob) ? prob : 'Media',
      imp: ['Alto', 'Medio', 'Bajo'].includes(imp) ? imp : 'Alto',
      mit: xlNorm(row[5]), cont: xlNorm(row[6])
    });
  }
  return out.length ? out : [{ tipo: 'Técnico', desc: '', prob: 'Media', imp: 'Alto', mit: '', cont: '' }];
}

function xlParseSostenibilidad(wb) {
  const out = { sos_amb: '', sos_soc: '', sos_cap: '', imp_form: '', imp_soc: '', imp_amb: '', imp_tec: '' };
  const aoa = xlAOA(wb, '9. Sostenibilidad');
  if (!aoa) return out;
  // Los primeros 3 (Ambiental/Social/Institucional) son de Sostenibilidad; los últimos 4 son Impactos.
  const orden = [
    ['Ambiental', 'sos_amb'], ['Social', 'sos_soc'], ['Institucional / Financiera', 'sos_cap']
  ];
  const ordenImpactos = [
    ['En formación', 'imp_form'], ['Social', 'imp_soc'], ['Ambiental', 'imp_amb'], ['Tecnológico', 'imp_tec']
  ];
  let enImpactos = false;
  let idxSos = 0, idxImp = 0;
  for (let r = 0; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const b = xlNorm(row[1]);
    if (/^IMPACTOS ESPERADOS$/i.test(b)) { enImpactos = true; continue; }
    if (!b || /^SOSTENIBILIDAD$/i.test(b)) continue;
    const val = xlNorm(row[2]);
    const clean = (val && !xlLooksLikeGuide(val)) ? val : '';
    if (!enImpactos && idxSos < orden.length) { out[orden[idxSos][1]] = clean; idxSos++; }
    else if (enImpactos && idxImp < ordenImpactos.length) { out[ordenImpactos[idxImp][1]] = clean; idxImp++; }
  }
  return out;
}

function xlBuildS(wb, LINEAS, MUNICIPIOS, RUBROS_SENA) {
  const ident = xlParseIdentificacion(wb, LINEAS, MUNICIPIOS);
  const arboles = xlParseArboles(wb);
  const obj_general = xlParseObjGeneral(wb);
  const matriz = xlParseMatrizYObjetivos(wb);
  const presupuesto_v2 = xlParsePresupuesto(wb, RUBROS_SENA);
  const riesgos = xlParseRiesgos(wb);
  const sos = xlParseSostenibilidad(wb);

  const objetivos_esp = matriz.objetivos_esp.length ? matriz.objetivos_esp : [
    { id: 1, texto: '', resultados: ['', '', ''], iov: { ind: '', base: '', meta: '', plazo: '' }, iov_resultados: [],
      mv: '', sup: '', res_mv: [], res_sup: [], actividades_struct: [] }
  ];

  return Object.assign({}, ident, arboles, {
    obj_general,
    obj_especifico: '',
    resultados: ['', '', '', ''],
    objetivos_esp,
    actividades_struct: [],
    iov_proposito: { ind: '', base: '', meta: '', plazo: '' },
    iov_resultados: [],
    fin_ind: matriz.fin_ind, fin_mv: matriz.fin_mv, fin_sup: matriz.fin_sup,
    prop_mv: '', prop_sup: '', res_mv: [], res_sup: [],
    precondiciones: matriz.precondiciones,
    presupuesto_v2, riesgos,
    sos_amb: sos.sos_amb, sos_soc: sos.sos_soc, sos_cap: sos.sos_cap,
    imp_form: sos.imp_form, imp_soc: sos.imp_soc, imp_amb: sos.imp_amb, imp_tec: sos.imp_tec,
    _migrated_v2: true
  });
}


function importExcel() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls';
  inp.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const fr = new FileReader();
    fr.onload = ev => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const nuevo = xlBuildS(wb, LINEAS, MUNICIPIOS, RUBROS_SENA);
        const encontroAlgo = nuevo.titulo || nuevo.problema || nuevo.obj_central || nuevo.objetivos_esp.some(o => o.texto);
        if (!encontroAlgo) {
          showToast('No se encontraron datos reconocibles en este Excel — revisa que use la plantilla del Formulador MML.', 'err', true);
          return;
        }
        const preview = '"' + (nuevo.titulo || '(sin título)').substring(0, 60) + '"';
        if (!confirm('Vas a CARGAR el proyecto ' + preview + ' desde este Excel.\n\nEsto reemplaza TODO lo que tengas actualmente en la app (igual que Importar respaldo). Si quieres conservar tu avance actual, expórtalo primero.\n\n¿Continuar?')) return;
        Object.assign(S, nuevo);
        S.session = 1; S.completed = [];
        if (S.f1 || S.titulo) S.completed.push(1);
        if (S.problema) S.completed.push(2);
        if (S.efdir.some(Boolean) || S.cadir.some(Boolean)) S.completed.push(3);
        if (S.obj_central) S.completed.push(4);
        if (S.objetivos_esp.some(o => o.texto)) S.completed.push(5);
        if (S.obj_general) S.completed.push(6);
        if (S.objetivos_esp.some(o => o.iov.ind)) S.completed.push(7);
        if (S.objetivos_esp.some(o => o.mv)) S.completed.push(8);
        if (S.presupuesto_v2.some(r => r.items.some(i => i.desc)) || S.riesgos.some(r => r.desc)) S.completed.push(9);
        if (S.sos_amb || S.imp_form) S.completed.push(10);
        S.session = S.completed.length ? Math.min(Math.max(...S.completed) + 1, 10) : 1;
        scheduleSave(); render();
        showToast('Proyecto cargado desde Excel ✓ Revísalo sesión por sesión antes de continuar.', 'green', true);
      } catch (err) {
        showToast('Error al leer el Excel: ' + err.message, 'err', true);
      }
    };
    fr.readAsArrayBuffer(file);
  };
  inp.click();
}

function importJSON() {
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=e=>{
    const fr=new FileReader();
    fr.onload=ev=>{
      try{
        const p=JSON.parse(ev.target.result);
        if(p.data) Object.assign(S,p.data);
        scheduleSave(); render(); showToast('Datos restaurados ✓','green');
      }catch(err){showToast('Error al leer archivo','');}
    };
    fr.readAsText(e.target.files[0]);
  };
  inp.click();
}

function checkEmergencyBackup() {
  try {
    const backup = localStorage.getItem(STORAGE_KEY + '_backup');
    if (!backup) { showToast('No hay respaldo de emergencia disponible.', ''); return; }
    const parsed = JSON.parse(backup);
    if (!parsed || !hasContent(parsed.data)) { showToast('El respaldo de emergencia está vacío.', ''); return; }
    const fecha = parsed.t ? new Date(parsed.t).toLocaleString('es-CO') : 'desconocida';
    if (hasContent(S)) {
      if (!confirm(`Hay un respaldo de emergencia del ${fecha}. Tu sesión actual ya tiene contenido — ¿quieres reemplazarlo con el respaldo de todos modos?`)) return;
    } else {
      if (!confirm(`Se encontró un respaldo de emergencia del ${fecha} con datos. ¿Restaurarlo ahora?`)) return;
    }
    Object.assign(S, parsed.data);
    scheduleSave(); render();
    showToast('Respaldo de emergencia restaurado ✓','green');
  } catch(e) {
    showToast('Error al leer el respaldo de emergencia.', '');
  }
}

function normalizeTreeArrays() {
  function sync(dirKey, indKey) {
    const target = Math.max(S[dirKey].length, S[indKey].length);
    while (S[dirKey].length < target) S[dirKey].push('');
    while (S[indKey].length < target) S[indKey].push('');
  }
  sync('efdir', 'efind');
  sync('cadir', 'caind');
  sync('fdir', 'find_');
  sync('mdir', 'mind');
}

function renderSession() {
  normalizeTreeArrays();
  switch(S.session) {
    case 1:  return renderS1();
    case 2:  return renderS2();
    case 3:  return renderS3();
    case 4:  return renderS4();
    case 5:  return renderS5();
    case 6:  return renderS6();
    case 7:  return renderS7();
    case 8:  return renderS8();
    case 9:  return renderS9();
    case 10: return renderS10();
    default: return '';
  }
}

    '</div></div>' +
    '<div class="body">' +
    '<div class="sidebar">' +
    '<div class="sidebar-section">Progreso general</div>' +
    '<div class="prog-bar"><div class="prog-fill" style="width:'+p+'%"></div></div>' +
    '<div style="font-size:11px;color:var(--ink3);padding:0 14px 8px;text-align:right">'+p+'% completado</div>' +
    '<div class="sidebar-section">Sesiones</div>' +
    SESSIONS.map(s =>
      '<div class="nav-item'+(S.session===s.id?' active':'')+(S.completed.includes(s.id)?' done':'')+'" onclick="goSession('+s.id+')" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\')goSession('+s.id+')">' +
      '<div class="nav-num" aria-hidden="true">'+(S.completed.includes(s.id)?'✓':s.id)+'</div>' +
      '<div style="line-height:1.3">'+s.label+'</div></div>'
    ).join('') +
    '<div class="sidebar-divider"></div>' +
    '<button class="sidebar-btn" onclick="showPDFPreview()" aria-label="Ver vista previa y descargar PDF">' +
    '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Vista previa / PDF</button>' +
    '<button class="sidebar-btn" onclick="exportPDF()" aria-label="Descargar PDF directamente">' +
    '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Descargar PDF</button>' +
    '<button class="sidebar-btn" onclick="exportJSON()">' +
    '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Exportar respaldo .json</button>' +
    '<button class="sidebar-btn" onclick="importJSON()">' +
    '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><line x1="12" y1="3" x2="12" y2="15"/><polyline points="7 10 12 5 17 10"/></svg>Importar respaldo .json</button>' +
    '<button class="sidebar-btn" onclick="importExcel()" style="color:#0f766e">' +
    '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 13h2v5H8zM14 13h2v5h-2zM8 8h8"/></svg>Cargar desde Excel</button>' +
    '<button class="sidebar-btn" onclick="checkEmergencyBackup()" style="color:#92400e">' +
    '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Revisar respaldo de emergencia</button>' +
    '</div>' +
    '<div class="main"><div class="main-inner">' +
    '<div class="session-header">' +
    '<span class="badge badge-s">Sesión '+S.session+' de 10</span>' +
    '<span class="badge badge-sec">'+sess.label+'</span>' +
    '<h2 style="margin-top:6px">'+sess.label+'</h2>' +
    '<p style="margin-top:4px">Complete los campos. El botón <strong style="background:var(--b2);color:#fff;border-radius:50%;display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;font-size:10px">?</strong> muestra la definición oficial y ejemplos de redacción.</p>' +
    '</div>' +
    renderSession() +
    '<div class="completeness-bar" style="margin-top:12px">' +
    '<span class="completeness-label">Campos de esta sesión</span>' +
    '<div class="completeness-mini"><div class="completeness-mini-fill" style="width:'+comp.pct+'%;background:'+compColor+'"></div></div>' +
    '<span class="completeness-count '+(comp.pct>=80?'full':'partial')+'">'+comp.filled+'/'+comp.total+'</span>' +
    '</div>' +
    '<div class="nav-footer">' +
    '<button class="btn" onclick="goSession('+Math.max(1,S.session-1)+')" '+(S.session===1?'disabled':'')+' aria-label="Sesión anterior">' +
    '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg> Anterior</button>' +
    '<button class="btn primary" onclick="markDone()" style="'+btnStyle+'" aria-label="Marcar sesión como completada">'+btnLabel+'</button>' +
    '</div></div></div>' +
    '<div class="panel">' +
    '<div class="panel-title">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>' +
    'Matriz MML en vivo</div>' +
    '<div id="live-matrix">'+buildMatrixPreview()+'</div>' +
    '</div>' +
    '</div></div>' +
    buildDrawerHTML() +
    buildSheetHTML() +
    buildOnboardHTML() +
    '<div class="fab-row">' +
    '<button class="fab fab-secondary" onclick="openSheet()" aria-label="Ver matriz MML" title="Ver Matriz MML">📋</button>' +
    '<button class="fab fab-secondary" onclick="openDrawer()" aria-label="Abrir menú" title="Menú de sesiones">☰</button>' +
    '</div>';

  setTimeout(patchLive, 0);
  setTimeout(() => {
    const sm = document.getElementById('live-matrix-sheet');
    if(sm) sm.innerHTML = buildMatrixPreview();
  }, 0);
}

window.addEventListener('load', () => {
  loadSaved();
  initDB();
  render();
  if (_restauroDesdeRespaldo) {
    setTimeout(() => showToast(
      '⚠ Se restauró tu último respaldo guardado porque la carga normal venía vacía. Verifica que todo esté correcto y exporta un respaldo JSON desde el menú.',
      'err', true
    ), 300);
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') doSave();
});
</script>
</body>
</html>
